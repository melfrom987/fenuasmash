name: fenuasmash-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX manquant dans .env}/api:${IMAGE_TAG:-latest}
    restart: always
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Mémoire max de la JVM, en % de la mémoire du conteneur
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
    networks: [backend, frontend]
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  web:
    image: ${IMAGE_PREFIX}/web:${IMAGE_TAG:-latest}
    restart: always
    environment:
      API_UPSTREAM: api:8080
    ports:
      - "${HTTP_PORT:-80}:8080"
    networks: [frontend]
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

networks:
  frontend:
  backend:
    internal: true

volumes:
  db-data:
