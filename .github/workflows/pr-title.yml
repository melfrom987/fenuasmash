# Le titre de PR devient le message du commit squashé : il doit suivre
# Conventional Commits avec un périmètre connu (voir CONTRIBUTING.md).

name: Titre de PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Format Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
          scopes: |
            web
            api
            mobile
            infra
            contracts
            docs
            deps
          requireScope: false
