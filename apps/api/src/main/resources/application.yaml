spring:
  application:
    name: fenuasmash

  # Local defaults, matching the database started by `make db`.
  # In Docker and CI they are overridden by the SPRING_DATASOURCE_* variables.
  datasource:
    url: jdbc:postgresql://localhost:5432/fenuasmash
    username: fenuasmash
    password: change-me

  jpa:
    # No lazy loading in controllers: queries stay inside the service layer
    open-in-view: false
    hibernate:
      # The schema is managed by Flyway only; Hibernate just checks it matches the entities
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  mvc:
    problemdetails:
      enabled: true

  autoconfigure:
    # No default in-memory user with a generated password: accounts live in the database
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

fenuasmash:
  security:
    jwt:
      # Local default only: every deployment must set FENUASMASH_SECURITY_JWT_SECRET (32 bytes minimum)
      secret: local-dev-secret-change-me-0123456789
      # Covers a full tournament day
      ttl: 12h

server:
  # Finish in-flight requests before stopping (deployments, restarts)
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
