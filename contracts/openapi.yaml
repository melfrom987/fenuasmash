openapi: 3.1.0

info:
  title: FenuaSmash API
  version: 0.1.0
  description: |
    Badminton tournament management: tournaments and their rules, events, courts,
    matches, clubs, players and registrations.

    This file is the single source of truth shared by the backend, the web app and the
    mobile app (see `contracts/README.md`). It is updated **before** the code.

    Conventions:
    - All dates and times are UTC, ISO 8601 (`2026-11-21T18:00:00Z`). Clients display them
      in Tahiti time (`Pacific/Tahiti`, UTC−10). Birth dates are plain dates (`2010-11-21`).
    - Identifiers are UUIDs.
    - `PATCH` updates only the fields present in the body. For nullable fields, a field sent
      as `null` is cleared, an absent field is kept.
    - Errors use the Problem Details format with a machine-readable `code`
      (see `ProblemDetail`). Clients translate the `code`, not the `detail`.

    Operations marked with `x-status: planned` are not implemented yet: they describe what
    the backend will implement next, so that web and mobile can work in parallel (with mocks).

    Authentication:
    - Log in with `POST /auth/login`, then send `Authorization: Bearer <accessToken>` on every
      request. The token is valid for 12 hours (`expiresAt`); after that, log in again.
    - Operations with `security: []` are public. The others need a token, and `x-roles` lists
      the roles allowed to call them.
    - No token, or an invalid or expired one, returns **401** `UNAUTHORIZED`, even on a public
      operation: the client should then log in again. A role that is not allowed returns
      **403** `FORBIDDEN`.

    | Role | Can |
    |---|---|
    | (public) | Read organizations, tournaments, events, courts, matches and clubs |
    | `ADMIN` | Create accounts and organizations |
    | `ORGANIZER` | Manage tournaments, events, courts, matches, clubs, players and registrations |
    | `CLUB` | Read players and registrations (planned: only the players of its club) |
    | `PLAYER` | Planned with online registration (phase 3) |

servers:
  - url: /api

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Accounts
  - name: Organizations
  - name: Tournaments
  - name: Events
  - name: Courts
  - name: Matches
  - name: Clubs
  - name: Players
  - name: Registrations
  - name: Import

paths:
  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Log in with an email and a password
      description: |
        The email is case insensitive. A wrong password and an unknown email get the same
        `INVALID_CREDENTIALS` answer, so that it never reveals whether an account exists.

        After 5 failed logins for one email, or 20 from one IP address, every login for that
        email or address is refused for 15 minutes with `TOO_MANY_LOGIN_ATTEMPTS`, even with
        the right password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 'Logged in. The response is never cached (`Cache-Control: no-store`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          $ref: '#/components/responses/Unauthorized'
          # INVALID_CREDENTIALS
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the logged-in account
      description: Any logged-in account. Read from the database, so it is always up to date.
      responses:
        '200':
          description: The logged-in account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Accounts
  /accounts:
    post:
      tags: [Accounts]
      operationId: createAccount
      x-roles: [ADMIN]
      summary: Create an account
      description: |
        Only `ORGANIZER` accounts can be created for now (`INVALID_ROLE` otherwise): club
        accounts come with clubs, as each one is linked to its club, and player accounts with
        online registration. The first admin is created when the API starts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # VALIDATION_FAILED, INVALID_ROLE, INVALID_ORGANIZATION
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/Conflict'
          # EMAIL_ALREADY_USED

  # ---------------------------------------------------------------- Organizations
  /organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      security: []
      summary: List organizations
      responses:
        '200':
          description: All organizations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Organization' }
    post:
      tags: [Organizations]
      operationId: createOrganization
      x-roles: [ADMIN]
      summary: Create an organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganizationRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      operationId: getOrganization
      security: []
      summary: Get an organization
      responses:
        '200':
          description: The organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Tournaments
  /tournaments:
    get:
      tags: [Tournaments]
      operationId: listTournaments
      security: []
      summary: List tournaments, most recent start first
      responses:
        '200':
          description: All tournaments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tournament' }
    post:
      tags: [Tournaments]
      operationId: createTournament
      x-roles: [ORGANIZER]
      summary: Create a tournament with its rules and its courts
      description: Courts numbered 1 to `courtCount` are created in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTournamentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tournament' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # VALIDATION_FAILED, INVALID_DATE_RANGE, INVALID_ORGANIZATION, INVALID_SCORING_RULES,
          # INVALID_RELAY_SETTINGS, INVALID_FORBIDDEN_COMBINATION
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tournaments/{tournamentId}:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    get:
      tags: [Tournaments]
      operationId: getTournament
      security: []
      summary: Get a tournament
      responses:
        '200':
          description: The tournament
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tournament' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tournaments]
      operationId: updateTournament
      x-roles: [ORGANIZER]
      summary: Update a tournament and its rules
      description: |
        Only the fields present are changed. Removing a discipline that a forbidden
        combination uses is rejected with `INVALID_FORBIDDEN_COMBINATION`.
        Planned: `RULES_LOCKED` (409) once an event has started.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTournamentRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tournament' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Tournaments]
      operationId: deleteTournament
      x-roles: [ORGANIZER]
      summary: Delete a tournament that has not started
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          # TOURNAMENT_ALREADY_STARTED
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Events
  /tournaments/{tournamentId}/events:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    get:
      tags: [Events]
      operationId: listEvents
      security: []
      summary: List the events of a tournament
      description: Sorted by discipline (MS, WS, MD, WD, XD, OD), then by name.
      responses:
        '200':
          description: The events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Events]
      operationId: createEvent
      x-roles: [ORGANIZER]
      summary: Create an event
      description: |
        Events are created before registrations open. Pool settings can stay empty until
        the draw; if one is set, all three are required. They are rejected when the
        tournament format has no pools.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # VALIDATION_FAILED (categoryLabel required unless OPEN), INVALID_FORMAT_SETTINGS
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          # EVENT_NAME_ALREADY_EXISTS
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      operationId: getEvent
      security: []
      summary: Get an event
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Events]
      operationId: updateEvent
      x-roles: [ORGANIZER]
      summary: Update an event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEventRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Events]
      operationId: deleteEvent
      x-roles: [ORGANIZER]
      summary: Delete an event
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Courts
  /tournaments/{tournamentId}/courts:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    get:
      tags: [Courts]
      operationId: listCourts
      security: []
      summary: List the courts of a tournament, by number
      responses:
        '200':
          description: The courts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Court' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Courts]
      operationId: addCourt
      x-roles: [ORGANIZER]
      summary: Add a court with the next number
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Court' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          # COURT_LIMIT_REACHED (50 courts)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /courts/{courtId}:
    parameters:
      - $ref: '#/components/parameters/CourtId'
    get:
      tags: [Courts]
      operationId: getCourt
      security: []
      summary: Get a court
      responses:
        '200':
          description: The court
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Court' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Courts]
      operationId: updateCourt
      x-roles: [ORGANIZER]
      summary: Enable or disable a court
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCourtRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Court' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Courts]
      operationId: deleteCourt
      x-roles: [ORGANIZER]
      summary: Remove the last court of a tournament
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          # COURT_NOT_LAST; planned: COURT_IN_USE
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Matches
  /events/{eventId}/matches:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Matches]
      operationId: listEventMatches
      security: []
      summary: List the matches of an event
      description: By round (matches without a round last), then creation order.
      responses:
        '200':
          description: The matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Match' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Matches]
      operationId: createMatch
      x-roles: [ORGANIZER]
      summary: Create a match in an event
      description: |
        Matches will mostly be created by the draws (#92, #93). This operation creates one by
        hand, for example for a demonstration or a match added on the day. A side can stay
        empty until it is known, e.g. the winner of a previous round.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMatchRequest' }
      responses:
        '201':
          description: Created, with status `SCHEDULED`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # VALIDATION_FAILED, INVALID_MATCH_SIDES (same registration on both sides)
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tournaments/{tournamentId}/matches:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    get:
      tags: [Matches]
      operationId: listTournamentMatches
      security: []
      summary: List the matches of a tournament, all events together
      description: By round (matches without a round last), then creation order.
      parameters:
        - name: status
          in: query
          description: Only the matches in these statuses; repeat it for several (`?status=READY&status=CALLED`)
          schema:
            type: array
            items: { $ref: '#/components/schemas/MatchStatus' }
          style: form
          explode: true
      responses:
        '200':
          description: The matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Match' }
        '404': { $ref: '#/components/responses/NotFound' }

  /matches/{matchId}:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    get:
      tags: [Matches]
      operationId: getMatch
      security: []
      summary: Get a match
      responses:
        '200':
          description: The match
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '404': { $ref: '#/components/responses/NotFound' }

  /matches/{matchId}/status:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    post:
      tags: [Matches]
      operationId: changeMatchStatus
      x-roles: [ORGANIZER]
      summary: Move a match to another status
      description: |
        Only these transitions are allowed:

        | From | To |
        |---|---|
        | `SCHEDULED` | `READY`, `CANCELLED`, `WALKOVER` |
        | `READY` | `SCHEDULED`, `CALLED`, `CANCELLED`, `WALKOVER` |
        | `CALLED` | `READY`, `WARMUP`, `CANCELLED`, `WALKOVER` |
        | `WARMUP` | `CALLED`, `IN_PROGRESS`, `CANCELLED`, `WALKOVER` |
        | `IN_PROGRESS` | `FINISHED` |
        | `FINISHED` | `IN_PROGRESS` (reopened, e.g. to undo the last point) |
        | `CANCELLED`, `WALKOVER` | none: final |

        Any other transition gets `INVALID_STATUS_TRANSITION`. Every status except
        `SCHEDULED` and `CANCELLED` needs both sides (`MATCH_SIDES_INCOMPLETE`).

        **Result:** `FINISHED` needs `winner` and `outcome` (`NORMAL`, or `RETIRED` when the
        loser retired). `WALKOVER` needs `winner` (the side that did not forfeit); its
        outcome is `WALKOVER`. Other statuses take neither (`INVALID_MATCH_RESULT`). Leaving
        `FINISHED` clears the result.

        **Concurrent changes:** send the `stateVersion` read with the match. If the match
        changed since, nothing is applied and the answer is `STATE_VERSION_CONFLICT`: read
        the match again, then decide. Every change increments `stateVersion`.

        Planned: the umpire tablet of the court will also move its match (warm-up, start,
        retirement), once matches are assigned to courts (#99).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeMatchStatusRequest' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # VALIDATION_FAILED, INVALID_MATCH_RESULT
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          # INVALID_STATUS_TRANSITION, MATCH_SIDES_INCOMPLETE, STATE_VERSION_CONFLICT
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Clubs (planned)
  /clubs:
    get:
      tags: [Clubs]
      operationId: listClubs
      security: []
      x-status: planned
      summary: List clubs, by name
      parameters:
        - name: q
          in: query
          description: Filters on the name (case and accent insensitive)
          schema: { type: string }
      responses:
        '200':
          description: The clubs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Club' }
    post:
      tags: [Clubs]
      operationId: createClub
      x-roles: [ORGANIZER]
      x-status: planned
      summary: Create a club
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClubRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          $ref: '#/components/responses/Conflict'
          # CLUB_NAME_ALREADY_EXISTS
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /clubs/{clubId}:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Clubs]
      operationId: getClub
      security: []
      x-status: planned
      summary: Get a club
      responses:
        '200':
          description: The club
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Clubs]
      operationId: updateClub
      x-roles: [ORGANIZER]
      x-status: planned
      summary: Update a club
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateClubRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Players (planned)
  /players:
    get:
      tags: [Players]
      operationId: listPlayers
      x-roles: [ORGANIZER, CLUB]
      x-status: planned
      summary: Search players, paginated, by last name then first name
      parameters:
        - name: q
          in: query
          description: Matches last name, first name or license number (case and accent insensitive)
          schema: { type: string }
        - name: clubId
          in: query
          schema: { type: string, format: uuid }
        - name: gender
          in: query
          schema: { $ref: '#/components/schemas/Gender' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of players
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Players]
      operationId: createPlayer
      x-roles: [ORGANIZER]
      x-status: planned
      summary: Create a player
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlayerRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # VALIDATION_FAILED, INVALID_CLUB
        '409':
          $ref: '#/components/responses/Conflict'
          # PLAYER_LICENSE_ALREADY_EXISTS
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /players/{playerId}:
    parameters:
      - $ref: '#/components/parameters/PlayerId'
    get:
      tags: [Players]
      operationId: getPlayer
      x-roles: [ORGANIZER, CLUB]
      x-status: planned
      summary: Get a player
      responses:
        '200':
          description: The player
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Players]
      operationId: updatePlayer
      x-roles: [ORGANIZER]
      x-status: planned
      summary: Update a player profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePlayerRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Registrations (planned)
  /tournaments/{tournamentId}/registrations:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    get:
      tags: [Registrations]
      operationId: listTournamentRegistrations
      x-roles: [ORGANIZER, CLUB]
      x-status: planned
      summary: List the registrations of a tournament
      parameters:
        - name: eventId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RegistrationStatus' }
        - name: playerId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The registrations, by event then by registration date
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Registration' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /events/{eventId}/registrations:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Registrations]
      operationId: listEventRegistrations
      x-roles: [ORGANIZER, CLUB]
      x-status: planned
      summary: List the registrations of an event
      responses:
        '200':
          description: The registrations, by registration date
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Registration' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Registrations]
      operationId: createRegistration
      x-roles: [ORGANIZER]
      x-status: planned
      summary: Register a player (and a partner for doubles) in an event
      description: |
        Entered by the organizer in the MVP, so a pair is confirmed at once.
        - Singles: `partnerId` must be absent.
        - Doubles: with `partnerId` → `CONFIRMED`; without → `LOOKING_FOR_PARTNER`.
        Checked rules: gender against the discipline, age category (birth year bounds),
        maximum entries, forbidden combinations, not already registered in the event.
        (`PENDING_PARTNER` only comes from imports, and later from player accounts.)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRegistrationRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # VALIDATION_FAILED (partnerId on singles), PLAYER_NOT_ELIGIBLE, PARTNER_NOT_ELIGIBLE,
          # FORBIDDEN_COMBINATION
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          # ALREADY_REGISTERED, PARTNER_ALREADY_REGISTERED, EVENT_FULL
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /events/{eventId}/eligible-players:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Registrations]
      operationId: listEligiblePlayers
      x-roles: [ORGANIZER, CLUB]
      x-status: planned
      summary: Players who can register in this event (or partner someone in it)
      description: |
        Used for the player and partner pickers: right gender for the discipline (for a
        partner, relative to `partnerOf`), right age category, not already registered in the
        event. Paginated like `listPlayers`.
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: partnerOf
          in: query
          description: Only players who can partner this player (e.g. a woman for a man in mixed doubles)
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of eligible players
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /registrations/{registrationId}:
    parameters:
      - $ref: '#/components/parameters/RegistrationId'
    patch:
      tags: [Registrations]
      operationId: updateRegistration
      x-roles: [ORGANIZER]
      x-status: planned
      summary: Set or change the partner, or confirm a pending pair
      description: |
        - `partnerId` set → the pair is `CONFIRMED` (organizer action).
        - `partnerId: null` → `LOOKING_FOR_PARTNER`.
        - `confirm: true` on a `PENDING_PARTNER` registration → `CONFIRMED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRegistrationRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Registrations]
      operationId: deleteRegistration
      x-roles: [ORGANIZER]
      x-status: planned
      summary: Withdraw a registration
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Import (planned)
  /tournaments/{tournamentId}/registrations/import:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    post:
      tags: [Import]
      operationId: importRegistrations
      x-roles: [ORGANIZER]
      x-status: planned
      summary: Import registrations from a registration form export
      description: |
        The web app reads the CSV or Excel file, lets the organizer map columns and values to
        fields and events, and sends the rows already normalized.

        The backend then, for each row:
        1. matches the player against existing profiles (name, birth date, club) and classifies
           the result (`EXACT`, `PROBABLE`, `AMBIGUOUS`, `NONE`);
        2. matches each partner name against the other rows of the file, then existing profiles;
        3. computes each registration status: A names B and B names A in the same event →
           `CONFIRMED`; only A names B → `PENDING_PARTNER`; "looking for a partner" →
           `LOOKING_FOR_PARTNER`;
        4. checks the registration rules (gender, age, maximum entries, forbidden combinations).

        With `dryRun=true` (preview), nothing is saved and the full report is returned,
        including candidate profiles. The organizer then resolves doubts and sends the rows
        again with `dryRun=false` and their decisions (`playerDecision`, `partnerDecision`).

        With `dryRun=false`, every resolved row without error is imported in one transaction;
        the other rows are skipped and reported. Importing the same file twice does not create
        duplicates: already registered entries are reported as `ALREADY_REGISTERED`.
      parameters:
        - name: dryRun
          in: query
          required: true
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '200':
          description: Import report (also for `dryRun=false`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token returned by `POST /auth/login`

  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TournamentId:
      name: tournamentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CourtId:
      name: courtId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MatchId:
      name: matchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClubId:
      name: clubId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlayerId:
      name: playerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Page number, starting at 0
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found (`<RESOURCE>_NOT_FOUND`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with the current state
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Missing, invalid or expired token (`UNAUTHORIZED`). Log in again.
      headers:
        WWW-Authenticate:
          schema: { type: string, example: Bearer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: The role of the account is not allowed (`FORBIDDEN`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: Too many failed logins (`TOO_MANY_LOGIN_ATTEMPTS`)
      headers:
        Retry-After:
          description: Seconds to wait before trying again
          schema: { type: integer, example: 900 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    # ------------------------------------------------------------ Errors
    ProblemDetail:
      type: object
      required: [status, title, code]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Bad Request }
        status: { type: integer, example: 400 }
        detail:
          type: string
          description: Technical message in English, for developers. Never shown as is.
        instance: { type: string, example: /api/tournaments }
        code: { $ref: '#/components/schemas/ErrorCode' }
        errors:
          type: array
          description: Field errors, with `VALIDATION_FAILED`
          items: { $ref: '#/components/schemas/FieldError' }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Request field path, e.g. `categoryLabel` or `scoring.pointCap`
        message: { type: string }

    ErrorCode:
      type: string
      description: |
        Machine-readable error code, translated by clients. `x-status: planned` codes come
        with planned operations.
      enum:
        # Generic
        - VALIDATION_FAILED
        - DATA_CONFLICT
        - INTERNAL_ERROR
        # Authentication and accounts
        - UNAUTHORIZED
        - FORBIDDEN
        - INVALID_CREDENTIALS
        - TOO_MANY_LOGIN_ATTEMPTS
        - INVALID_ROLE
        - EMAIL_ALREADY_USED
        # Not found
        - ORGANIZATION_NOT_FOUND
        - TOURNAMENT_NOT_FOUND
        - EVENT_NOT_FOUND
        - COURT_NOT_FOUND
        - MATCH_NOT_FOUND
        - CLUB_NOT_FOUND
        - PLAYER_NOT_FOUND
        - REGISTRATION_NOT_FOUND
        # Tournaments
        - INVALID_DATE_RANGE
        - INVALID_ORGANIZATION
        - INVALID_SCORING_RULES
        - INVALID_RELAY_SETTINGS
        - INVALID_FORBIDDEN_COMBINATION
        - TOURNAMENT_ALREADY_STARTED
        - RULES_LOCKED
        # Events
        - EVENT_NAME_ALREADY_EXISTS
        - INVALID_FORMAT_SETTINGS
        # Courts
        - COURT_LIMIT_REACHED
        - COURT_NOT_LAST
        - COURT_INACTIVE
        - COURT_IN_USE
        # Matches
        - INVALID_MATCH_SIDES
        - INVALID_MATCH_RESULT
        - INVALID_STATUS_TRANSITION
        - MATCH_SIDES_INCOMPLETE
        - STATE_VERSION_CONFLICT
        # Clubs and players (planned)
        - CLUB_NAME_ALREADY_EXISTS
        - INVALID_CLUB
        - PLAYER_LICENSE_ALREADY_EXISTS
        # Registrations (planned)
        - PLAYER_NOT_ELIGIBLE
        - PARTNER_NOT_ELIGIBLE
        - ALREADY_REGISTERED
        - PARTNER_ALREADY_REGISTERED
        - EVENT_FULL
        - FORBIDDEN_COMBINATION
        - NOT_PENDING
        # Import (planned)
        - PLAYER_UNRESOLVED
        - PARTNER_UNRESOLVED
        - UNKNOWN_EVENT

    # ------------------------------------------------------------ Enums
    Discipline:
      type: string
      description: MS men's singles, WS women's singles, MD men's doubles, WD women's doubles, XD mixed doubles, OD open doubles (any pair)
      enum: [MS, WS, MD, WD, XD, OD]
    CompetitionType:
      type: string
      description: TEAM is phase 2
      enum: [INDIVIDUAL, TEAM]
    DrawFormat:
      type: string
      description: SINGLE_POOL is a round robin (everyone plays everyone)
      enum: [SINGLE_ELIMINATION, POOLS_THEN_ELIMINATION, SINGLE_POOL]
    PlayMode:
      type: string
      description: RELAY (relay scoring with steps) is phase 2
      enum: [SETS, RELAY]
    CategoryType:
      type: string
      description: OPEN to all, AGE (youth or veterans, from the birth year), LEVEL (ranking level)
      enum: [OPEN, AGE, LEVEL]
    Gender:
      type: string
      enum: [MALE, FEMALE]
    RegistrationStatus:
      type: string
      description: |
        CONFIRMED: singles, or a pair confirmed by both players (or entered by the organizer).
        PENDING_PARTNER: the partner has not confirmed yet.
        LOOKING_FOR_PARTNER: doubles without a partner yet.
      enum: [CONFIRMED, PENDING_PARTNER, LOOKING_FOR_PARTNER]

    # ------------------------------------------------------------ Auth and accounts
    UserRole:
      type: string
      enum: [ADMIN, ORGANIZER, CLUB, PLAYER]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 1, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresAt]
      properties:
        accessToken:
          type: string
          description: 'To send as `Authorization: Bearer <accessToken>`'
        tokenType: { type: string, enum: [Bearer] }
        expiresAt: { type: string, format: date-time }

    CurrentUser:
      type: object
      required: [id, email, role, organizationId]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        organizationId:
          type: [string, 'null']
          format: uuid
          description: The federation of an organizer; null for other roles

    Account:
      type: object
      required: [id, email, role, organizationId, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, description: Stored in lower case }
        role: { $ref: '#/components/schemas/UserRole' }
        organizationId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }

    CreateAccountRequest:
      type: object
      required: [email, password, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 12
          maxLength: 72
          description: At most 72 bytes in UTF-8
        role:
          allOf: [{ $ref: '#/components/schemas/UserRole' }]
          description: Only `ORGANIZER` for now
        organizationId:
          type: [string, 'null']
          format: uuid
          description: Required for an organizer

    # ------------------------------------------------------------ Organizations
    Organization:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }

    # ------------------------------------------------------------ Tournaments
    ScoringRules:
      type: object
      required: [gamesToWin, pointsToWin, twoPointLead, pointCap]
      properties:
        gamesToWin: { type: integer, minimum: 1, maximum: 3 }
        pointsToWin:
          type: integer
          minimum: 1
          maximum: 50
          description: Points to win a game (in relay mode, the target score)
        twoPointLead:
          type: boolean
          description: false = the first to reach `pointsToWin` wins
        pointCap:
          type: [integer, 'null']
          minimum: 1
          maximum: 50
          description: Required and ≥ `pointsToWin` when `twoPointLead`, otherwise null

    DisciplinePair:
      type: array
      items: { $ref: '#/components/schemas/Discipline' }
      minItems: 2
      maxItems: 2
      description: Two different disciplines, both offered by the tournament

    Tournament:
      type: object
      required:
        - id
        - organizationId
        - name
        - startsAt
        - endsAt
        - minimumRestMinutes
        - competitionType
        - drawFormat
        - playMode
        - scoring
        - relayStep
        - disciplines
        - forbiddenCombinations
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        minimumRestMinutes: { type: integer, minimum: 0, maximum: 1440 }
        competitionType: { $ref: '#/components/schemas/CompetitionType' }
        drawFormat: { $ref: '#/components/schemas/DrawFormat' }
        playMode: { $ref: '#/components/schemas/PlayMode' }
        scoring: { $ref: '#/components/schemas/ScoringRules' }
        relayStep:
          type: [integer, 'null']
          minimum: 1
          maximum: 50
          description: Only in RELAY mode
        disciplines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Discipline' }
        forbiddenCombinations:
          type: array
          items: { $ref: '#/components/schemas/DisciplinePair' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateTournamentRequest:
      type: object
      required:
        - organizationId
        - name
        - startsAt
        - endsAt
        - minimumRestMinutes
        - courtCount
        - competitionType
        - drawFormat
        - playMode
        - scoring
        - disciplines
      properties:
        organizationId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        startsAt: { type: string, format: date-time }
        endsAt:
          type: string
          format: date-time
          description: After `startsAt` (INVALID_DATE_RANGE)
        minimumRestMinutes: { type: integer, minimum: 0, maximum: 1440 }
        courtCount: { type: integer, minimum: 1, maximum: 50 }
        competitionType: { $ref: '#/components/schemas/CompetitionType' }
        drawFormat: { $ref: '#/components/schemas/DrawFormat' }
        playMode: { $ref: '#/components/schemas/PlayMode' }
        scoring: { $ref: '#/components/schemas/ScoringRules' }
        relayStep: { type: [integer, 'null'], minimum: 1, maximum: 50 }
        disciplines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Discipline' }
        forbiddenCombinations:
          type: array
          default: []
          items: { $ref: '#/components/schemas/DisciplinePair' }

    UpdateTournamentRequest:
      type: object
      description: Every field is optional; only present fields change.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        minimumRestMinutes: { type: integer, minimum: 0, maximum: 1440 }
        competitionType: { $ref: '#/components/schemas/CompetitionType' }
        drawFormat: { $ref: '#/components/schemas/DrawFormat' }
        playMode: { $ref: '#/components/schemas/PlayMode' }
        scoring:
          type: object
          description: Only present fields change
          properties:
            gamesToWin: { type: integer, minimum: 1, maximum: 3 }
            pointsToWin: { type: integer, minimum: 1, maximum: 50 }
            twoPointLead: { type: boolean }
            pointCap: { type: [integer, 'null'], minimum: 1, maximum: 50 }
        relayStep: { type: [integer, 'null'], minimum: 1, maximum: 50 }
        disciplines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Discipline' }
        forbiddenCombinations:
          type: array
          items: { $ref: '#/components/schemas/DisciplinePair' }

    # ------------------------------------------------------------ Events
    Event:
      type: object
      required:
        - id
        - tournamentId
        - name
        - discipline
        - categoryType
        - categoryLabel
        - plannedDate
        - maxEntries
        - minBirthYear
        - maxBirthYear
        - poolCount
        - poolSize
        - qualifiersPerPool
      properties:
        id: { type: string, format: uuid }
        tournamentId: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        discipline: { $ref: '#/components/schemas/Discipline' }
        categoryType: { $ref: '#/components/schemas/CategoryType' }
        categoryLabel:
          type: [string, 'null']
          maxLength: 50
          description: Displayed label, e.g. "Cadet U17"; null for OPEN
        plannedDate:
          type: [string, 'null']
          format: date-time
          description: Planned day or slot, shown at registration
        maxEntries:
          type: [integer, 'null']
          minimum: 2
          maximum: 256
          description: Maximum entries (players, pairs or teams); null = unlimited
        minBirthYear:
          type: [integer, 'null']
          description: |
            Planned. Oldest birth year allowed (youth categories: younger players may play up).
            Only for AGE events.
          x-status: planned
        maxBirthYear:
          type: [integer, 'null']
          description: |
            Planned. Most recent birth year allowed (veterans). Only for AGE events.
          x-status: planned
        poolCount: { type: [integer, 'null'], minimum: 1 }
        poolSize: { type: [integer, 'null'], minimum: 3, maximum: 8 }
        qualifiersPerPool:
          type: [integer, 'null']
          minimum: 1
          maximum: 7
          description: Less than `poolSize`

    CreateEventRequest:
      type: object
      required: [name, discipline, categoryType]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        discipline: { $ref: '#/components/schemas/Discipline' }
        categoryType: { $ref: '#/components/schemas/CategoryType' }
        categoryLabel:
          type: [string, 'null']
          maxLength: 50
          description: Required unless OPEN (VALIDATION_FAILED on `categoryLabel`)
        plannedDate: { type: [string, 'null'], format: date-time }
        maxEntries: { type: [integer, 'null'], minimum: 2, maximum: 256 }
        minBirthYear: { type: [integer, 'null'], x-status: planned }
        maxBirthYear: { type: [integer, 'null'], x-status: planned }
        poolCount: { type: [integer, 'null'], minimum: 1 }
        poolSize: { type: [integer, 'null'], minimum: 3, maximum: 8 }
        qualifiersPerPool: { type: [integer, 'null'], minimum: 1, maximum: 7 }

    UpdateEventRequest:
      type: object
      description: |
        Only present fields change. `plannedDate`, `maxEntries`, `minBirthYear` and
        `maxBirthYear` sent as null are cleared.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        discipline: { $ref: '#/components/schemas/Discipline' }
        categoryType: { $ref: '#/components/schemas/CategoryType' }
        categoryLabel: { type: [string, 'null'], maxLength: 50 }
        plannedDate: { type: [string, 'null'], format: date-time }
        maxEntries: { type: [integer, 'null'], minimum: 2, maximum: 256 }
        minBirthYear: { type: [integer, 'null'], x-status: planned }
        maxBirthYear: { type: [integer, 'null'], x-status: planned }
        poolCount: { type: [integer, 'null'], minimum: 1 }
        poolSize: { type: [integer, 'null'], minimum: 3, maximum: 8 }
        qualifiersPerPool: { type: [integer, 'null'], minimum: 1, maximum: 7 }

    # ------------------------------------------------------------ Courts
    Court:
      type: object
      required: [id, tournamentId, number, active]
      properties:
        id: { type: string, format: uuid }
        tournamentId: { type: string, format: uuid }
        number:
          type: integer
          minimum: 1
          description: Unique in the tournament; displayed as "Court 3" by clients
        active:
          type: boolean
          description: A disabled court receives no new match

    UpdateCourtRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean }

    # ------------------------------------------------------------ Matches
    MatchStatus:
      type: string
      enum: [SCHEDULED, READY, CALLED, WARMUP, IN_PROGRESS, FINISHED, CANCELLED, WALKOVER]
      description: |
        - `SCHEDULED`: to be played; a side may still be unknown.
        - `READY`: both sides are known and available, waiting for a court.
        - `CALLED`: the players are called to the court.
        - `WARMUP`: the players warm up on the court.
        - `IN_PROGRESS`: being played.
        - `FINISHED`: won on the court (`NORMAL`) or by retirement during the match (`RETIRED`).
        - `CANCELLED`: will not be played, without a winner (e.g. event cancelled).
        - `WALKOVER`: won by forfeit before the start: a side did not show up or withdrew.

    MatchSide:
      type: string
      enum: [A, B]
      description: One of the two players or pairs of a match, as listed in the match

    MatchOutcome:
      type: string
      enum: [NORMAL, RETIRED, WALKOVER]
      description: |
        How the match was won: played to the end, retirement of the loser during the match,
        or forfeit before the start.

    Match:
      type: object
      required: [id, tournamentId, eventId, round, sideA, sideB, status, winner, outcome,
        stateVersion, startedAt, endedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        tournamentId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        round:
          type: [integer, 'null']
          minimum: 1
          description: Round in the draw, from 1; null when the match is not part of a draw
        sideA:
          type: [string, 'null']
          format: uuid
          description: Registration (player, or pair in doubles) of side A; null while unknown
        sideB:
          type: [string, 'null']
          format: uuid
          description: Registration of side B; null while unknown
        status: { $ref: '#/components/schemas/MatchStatus' }
        winner:
          oneOf:
            - $ref: '#/components/schemas/MatchSide'
            - type: 'null'
          description: Set with `FINISHED` and `WALKOVER`
        outcome:
          oneOf:
            - $ref: '#/components/schemas/MatchOutcome'
            - type: 'null'
          description: Set with `FINISHED` and `WALKOVER`
        stateVersion:
          type: integer
          minimum: 0
          description: Incremented on every change; send it back to change the status
        startedAt:
          type: [string, 'null']
          format: date-time
          description: When the match went `IN_PROGRESS` for the first time
        endedAt:
          type: [string, 'null']
          format: date-time
          description: When the match became `FINISHED`, `CANCELLED` or `WALKOVER`
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateMatchRequest:
      type: object
      properties:
        round: { type: [integer, 'null'], minimum: 1, maximum: 20 }
        sideA:
          type: [string, 'null']
          format: uuid
          description: Registration id; not checked until registrations are stored by the API
        sideB: { type: [string, 'null'], format: uuid }

    ChangeMatchStatusRequest:
      type: object
      required: [status, stateVersion]
      properties:
        status: { $ref: '#/components/schemas/MatchStatus' }
        stateVersion:
          type: integer
          minimum: 0
          description: The `stateVersion` of the match as read by the client
        winner:
          oneOf:
            - $ref: '#/components/schemas/MatchSide'
            - type: 'null'
          description: Required for `FINISHED` and `WALKOVER`
        outcome:
          type: [string, 'null']
          enum: [NORMAL, RETIRED, null]
          description: Required for `FINISHED`

    # ------------------------------------------------------------ Clubs (planned)
    Club:
      type: object
      required: [id, name, city]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        city: { type: [string, 'null'], maxLength: 100 }

    ClubRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique, case and accent insensitive (CLUB_NAME_ALREADY_EXISTS)
        city: { type: [string, 'null'], maxLength: 100 }

    UpdateClubRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        city: { type: [string, 'null'], maxLength: 100 }

    # ------------------------------------------------------------ Players (planned)
    Player:
      type: object
      required:
        - id
        - firstName
        - lastName
        - gender
        - birthDate
        - club
        - licenseNumber
        - email
        - phone
        - rankingPoints
        - rankingPosition
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        gender: { $ref: '#/components/schemas/Gender' }
        birthDate: { type: string, format: date }
        club: { $ref: '#/components/schemas/ClubSummary' }
        licenseNumber:
          type: [string, 'null']
          maxLength: 30
          description: Unique when set; optional in the MVP (the registration form does not ask for it)
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 30 }
        rankingPoints:
          type: [integer, 'null']
          description: French Polynesia ranking points; optional for now
        rankingPosition:
          type: [integer, 'null']
          minimum: 1
          description: French Polynesia ranking position; optional for now

    PlayerSummary:
      type: object
      description: Short form used inside registrations and import reports
      required: [id, firstName, lastName, gender, birthDate, clubName, licenseNumber]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        gender: { $ref: '#/components/schemas/Gender' }
        birthDate: { type: string, format: date }
        clubName: { type: string }
        licenseNumber: { type: [string, 'null'] }

    ClubSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    PlayerPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Player' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }

    CreatePlayerRequest:
      type: object
      required: [firstName, lastName, gender, birthDate, clubId]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        gender: { $ref: '#/components/schemas/Gender' }
        birthDate: { type: string, format: date }
        clubId:
          type: string
          format: uuid
          description: Unknown club → INVALID_CLUB
        licenseNumber: { type: [string, 'null'], maxLength: 30 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 30 }
        rankingPoints: { type: [integer, 'null'] }
        rankingPosition: { type: [integer, 'null'], minimum: 1 }

    UpdatePlayerRequest:
      type: object
      description: Only present fields change; nullable fields sent as null are cleared.
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        gender: { $ref: '#/components/schemas/Gender' }
        birthDate: { type: string, format: date }
        clubId: { type: string, format: uuid }
        licenseNumber: { type: [string, 'null'], maxLength: 30 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 30 }
        rankingPoints: { type: [integer, 'null'] }
        rankingPosition: { type: [integer, 'null'], minimum: 1 }

    # ------------------------------------------------------------ Registrations (planned)
    Registration:
      type: object
      required: [id, tournamentId, eventId, status, player, partner, createdAt]
      properties:
        id: { type: string, format: uuid }
        tournamentId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RegistrationStatus' }
        player: { $ref: '#/components/schemas/PlayerSummary' }
        partner:
          oneOf:
            - $ref: '#/components/schemas/PlayerSummary'
            - type: 'null'
          description: Null for singles and for LOOKING_FOR_PARTNER
        createdAt: { type: string, format: date-time }

    CreateRegistrationRequest:
      type: object
      required: [playerId]
      properties:
        playerId: { type: string, format: uuid }
        partnerId:
          type: [string, 'null']
          format: uuid
          description: Doubles only; absent or null = looking for a partner

    UpdateRegistrationRequest:
      type: object
      properties:
        partnerId: { type: [string, 'null'], format: uuid }
        confirm:
          type: boolean
          description: true confirms a PENDING_PARTNER pair (otherwise NOT_PENDING)

    # ------------------------------------------------------------ Import (planned)
    ImportRequest:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: '#/components/schemas/ImportRow' }

    ImportRow:
      type: object
      description: One line of the registration form, normalized by the web app
      required: [rowNumber, firstName, lastName, birthDate, gender, clubName, entries]
      properties:
        rowNumber:
          type: integer
          minimum: 1
          description: Line number in the file, to report errors
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        birthDate: { type: string, format: date }
        gender: { $ref: '#/components/schemas/Gender' }
        clubName:
          type: string
          minLength: 1
          description: Matched to an existing club (case and accent insensitive), otherwise created
        email: { type: [string, 'null'] }
        playerDecision: { $ref: '#/components/schemas/PlayerDecision' }
        entries:
          type: array
          description: One per event the player registers in
          items: { $ref: '#/components/schemas/ImportEntry' }

    ImportEntry:
      type: object
      required: [eventId, partner]
      properties:
        eventId: { type: string, format: uuid }
        partner: { $ref: '#/components/schemas/ImportPartner' }
        partnerDecision: { $ref: '#/components/schemas/PlayerDecision' }

    ImportPartner:
      type: object
      description: What the form said about the partner
      required: [kind]
      properties:
        kind:
          type: string
          enum: [NONE, LOOKING, NAMED]
          description: NONE = singles; LOOKING = "looking for a partner"; NAMED = a name was given
        name:
          type: string
          description: Full name as typed in the form, when NAMED

    PlayerDecision:
      type: object
      description: |
        The organizer's choice after a preview, for a row whose match was not EXACT.
        Absent = let the backend decide (EXACT match, or a new profile when NONE).
      required: [action]
      properties:
        action:
          type: string
          enum: [USE_EXISTING, CREATE_NEW]
        playerId:
          type: string
          format: uuid
          description: Required with USE_EXISTING

    PlayerMatch:
      type: object
      required: [result, selectedPlayerId, candidates]
      properties:
        result:
          type: string
          description: |
            EXACT: same name and birth date, associated automatically (shown for checking).
            PROBABLE: close name and same birth date, to confirm.
            AMBIGUOUS: several possible profiles, or same name with another birth date: the
            organizer chooses.
            NONE: no close profile, a new profile will be created.
          enum: [EXACT, PROBABLE, AMBIGUOUS, NONE]
        selectedPlayerId:
          type: [string, 'null']
          format: uuid
          description: Profile used if the import is confirmed as is (null = new profile, or undecided)
        candidates:
          type: array
          description: Best candidates first (at most 5)
          items: { $ref: '#/components/schemas/PlayerCandidate' }

    PlayerCandidate:
      type: object
      required: [player, score, reasons]
      properties:
        player: { $ref: '#/components/schemas/PlayerSummary' }
        score:
          type: number
          minimum: 0
          maximum: 1
        reasons:
          type: array
          items:
            type: string
            enum: [SAME_NAME, SIMILAR_NAME, SAME_BIRTH_DATE, DIFFERENT_BIRTH_DATE, SAME_CLUB, OTHER_ROW_OF_FILE]

    ImportIssue:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }

    ImportRowReport:
      type: object
      required: [rowNumber, imported, playerMatch, entries, issues]
      properties:
        rowNumber: { type: integer }
        imported:
          type: boolean
          description: Always false with dryRun
        playerMatch: { $ref: '#/components/schemas/PlayerMatch' }
        entries:
          type: array
          items:
            type: object
            required: [eventId, status, partnerMatch, issues]
            properties:
              eventId: { type: string, format: uuid }
              status:
                oneOf:
                  - $ref: '#/components/schemas/RegistrationStatus'
                  - type: 'null'
                description: Status the registration gets (null when it cannot be imported)
              partnerMatch:
                oneOf:
                  - $ref: '#/components/schemas/PlayerMatch'
                  - type: 'null'
                description: Null when there is no named partner
              issues:
                type: array
                description: |
                  E.g. PLAYER_NOT_ELIGIBLE, EVENT_FULL, FORBIDDEN_COMBINATION, PARTNER_UNRESOLVED,
                  ALREADY_REGISTERED (not blocking: the entry is skipped)
                items: { $ref: '#/components/schemas/ImportIssue' }
        issues:
          type: array
          description: Row-level issues, e.g. PLAYER_UNRESOLVED (AMBIGUOUS match without decision)
          items: { $ref: '#/components/schemas/ImportIssue' }

    ImportReport:
      type: object
      required: [dryRun, summary, rows]
      properties:
        dryRun: { type: boolean }
        summary:
          type: object
          required:
            - rows
            - rowsWithIssues
            - playersMatched
            - playersToCreate
            - playersToConfirm
            - confirmed
            - pendingPartner
            - lookingForPartner
          properties:
            rows: { type: integer }
            rowsWithIssues: { type: integer }
            playersMatched: { type: integer, description: EXACT matches }
            playersToCreate: { type: integer, description: NONE matches }
            playersToConfirm: { type: integer, description: PROBABLE and AMBIGUOUS matches without decision }
            confirmed: { type: integer }
            pendingPartner: { type: integer }
            lookingForPartner: { type: integer }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ImportRowReport' }
