  # ---------------------------------------------------------------- Import (planned)
  /tournaments/{tournamentId}/registrations/import:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    post:
      tags: [Import]
      operationId: importRegistrations
      x-roles: [ORGANIZER]
      x-status: planned
      summary: Import registrations from a registration form export
      description: |
        The web app reads the CSV or Excel file, lets the organizer map columns and values to
        fields and events, and sends the rows already normalized.

        The backend then, for each row:
        1. matches the player against existing profiles (name, birth date, club) and classifies
           the result (`EXACT`, `PROBABLE`, `AMBIGUOUS`, `NONE`);
        2. matches each partner name against the other rows of the file, then existing profiles;
        3. computes each registration status: A names B and B names A in the same event →
           `CONFIRMED`; only A names B → `PENDING_PARTNER`; "looking for a partner" →
           `LOOKING_FOR_PARTNER`;
        4. checks the registration rules (gender, age, maximum entries, forbidden combinations).

        With `dryRun=true` (preview), nothing is saved and the full report is returned,
        including candidate profiles. The organizer then resolves doubts and sends the rows
        again with `dryRun=false` and their decisions (`playerDecision`, `partnerDecision`).

        With `dryRun=false`, every resolved row without error is imported in one transaction;
        the other rows are skipped and reported. Importing the same file twice does not create
        duplicates: already registered entries are reported as `ALREADY_REGISTERED`.
      parameters:
        - name: dryRun
          in: query
          required: true
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '200':
          description: Import report (also for `dryRun=false`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Draws (planned)
  /events/{eventId}/draw:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Draws]
      operationId: getDraw
      x-status: planned
      summary: Draw of an event (pools and/or knockout bracket)
      responses:
        '200':
          description: The draw, draft or published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draw' }
        '404':
          $ref: '#/components/responses/NotFound'
          # EVENT_NOT_FOUND, DRAW_NOT_FOUND (no draw yet)
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Draws]
      operationId: createDraw
      x-roles: [ORGANIZER]
      x-status: planned
      summary: Run (or run again) the draw of an event
      description: |
        Draws the `CONFIRMED` registrations of the event; the others are listed in
        `excludedRegistrationIds`. Replaces the current draft. The settings are saved on the
        event (`poolCount`, `qualifiersPerPool`). Missing settings use the event's values, then
        the defaults:
        - `poolCount`: entries / 4, rounded, between 1 and 16. Pool sizes are derived: entries
          are split as evenly as possible (13 entries in 3 pools → 5, 4, 4), 3 to 8 per pool.
        - `qualifiersPerPool`: 2, less than the smallest pool.
        - `seedCount`: 2 up to a draw of 8, 4 up to 16, 8 up to 32, 16 beyond.

        See "Pools and Draw" in `docs/competition-rules.md` for the placement rules.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DrawSettings' }
      responses:
        '201':
          description: Draft draw
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draw' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # NOT_ENOUGH_ENTRIES, INVALID_DRAW_SETTINGS
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          # DRAW_PUBLISHED
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Draws]
      operationId: deleteDraw
      x-roles: [ORGANIZER]
      x-status: planned
      summary: Delete a draft draw
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          # DRAW_PUBLISHED
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /events/{eventId}/draw/swap:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Draws]
      operationId: swapDrawSlots
      x-roles: [ORGANIZER]
      x-status: planned
      summary: Swap two slots of a draft draw
      description: |
        Swaps two entries between pools or within a pool, or two lines of the bracket (an
        entry, a qualifier or a bye). A pool slot cannot be swapped with a bracket line.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DrawSwapRequest' }
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draw' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # INVALID_SWAP
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          # DRAW_PUBLISHED
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /events/{eventId}/draw/publish:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Draws]
      operationId: publishDraw
      x-roles: [ORGANIZER]
      x-status: planned
      summary: Publish the draw
      description: |
        Locks the draw and the registrations of the event: adding, changing, withdrawing or
        moving a registration is then refused with `DRAW_PUBLISHED`. Matches are generated
        from the published draw.
      responses:
        '200':
          description: Published draw
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draw' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          # DRAW_PUBLISHED
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /events/{eventId}/series:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Draws]
      operationId: splitIntoSeries
      x-roles: [ORGANIZER]
      x-status: planned
      summary: Split an event into level series
      description: |
        Before the draw, the organizer sorts the confirmed entries by ranking and splits them
        into level series (e.g. the 5 best in Series 1, the next 7 in Series 2…). In one
        transaction, for each series:
        - creates an event named `<event name> <label>` (e.g. "Simple Homme Série 1"),
          `categoryType: LEVEL`, `categoryLabel: <label>`, with the discipline, planned date and
          birth year bounds of the source event, and `parentEventId` = the source event;
        - moves the listed registrations into it (status and `registeredAt` kept).

        Rules: 2 to 8 series; labels filled and different; at least 2 entries per series; each
        registration is a `CONFIRMED` registration of the source event and appears once. The
        web app sends the entries in ranking order, but the backend does not re-sort them: the
        organizer decides. A series cannot be split again. The draft draw of the source event,
        if any, is deleted. Unlisted registrations stay in the source event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeriesSplitRequest' }
      responses:
        '201':
          description: The created series events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesSplitResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # INVALID_SERIES_SPLIT
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          # DRAW_PUBLISHED, EVENT_NAME_ALREADY_EXISTS
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Scores
  /matches/{matchId}/events:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    post:
      tags: [Scores]
      operationId: sendScoreEvents
      x-status: planned
      summary: Send the score events of a match, from the umpire tablet
      description: |
        The umpire tablet records each point, undo and game end as an event, keeps the
        events that are not confirmed yet in a local queue, and sends them with this
        operation. The queue survives network cuts and app restarts, so the same events
        can be sent again, late or several times: no point may be lost or counted twice.

        Rules:
        - **Event id:** generated by the tablet (UUID), unique. An event already received
          with the same content is reported in `duplicateIds` and not applied again.
          The same id with different content is rejected with `EVENT_ID_CONFLICT`.
        - **Sequence:** numbered from 1 for each match, by the tablet, without gaps. The
          server applies the events in sequence order, whatever their order in the batch.
          If events are missing before the batch, nothing is applied and `SEQUENCE_GAP`
          gives `expectedSequence`: the tablet sends again from there.
        - **Batch:** 1 to 100 events. Events are applied in one transaction: either the
          whole batch is accepted, or none of it.
        - **Confirmation:** the tablet removes an event from its queue only once its id
          is in `acceptedIds` or `duplicateIds`.

        Only the tablet paired with the court of the match can send its events (#144):
        the authentication scheme is defined with the pairing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScoreEventBatch' }
      responses:
        '200':
          description: Events applied or already received, with the resulting score
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreEventAck' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # VALIDATION_FAILED, INVALID_SCORE_EVENT (e.g. a point after the end of the match)
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The batch cannot be applied: `SEQUENCE_GAP` (send again from
            `expectedSequence`), `EVENT_ID_CONFLICT`, or `MATCH_NOT_IN_PROGRESS` (match not
            started yet, or a `POINT` sent once the match is finished).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ScoreEventProblem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Access token returned by `POST /auth/login` (a JWT), or tablet token returned by
        `POST /tablets/pair` (an opaque string starting with `fst_`)

  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TournamentId:
      name: tournamentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CourtId:
      name: courtId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MatchId:
      name: matchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TabletId:
      name: tabletId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClubId:
      name: clubId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlayerId:
      name: playerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Page number, starting at 0
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found (`<RESOURCE>_NOT_FOUND`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with the current state
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: |
        Missing, invalid or expired token (`UNAUTHORIZED`): log in again. With a tablet token,
        `TABLET_REVOKED` when the tablet was revoked: pair it again.
      headers:
        WWW-Authenticate:
          schema: { type: string, example: Bearer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: The role of the account is not allowed (`FORBIDDEN`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: Too many failed logins (`TOO_MANY_LOGIN_ATTEMPTS`) or pairings (`TOO_MANY_PAIRING_ATTEMPTS`)
      headers:
        Retry-After:
          description: Seconds to wait before trying again
          schema: { type: integer, example: 900 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    # ------------------------------------------------------------ Errors
    ProblemDetail:
      type: object
      required: [status, title, code]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Bad Request }
        status: { type: integer, example: 400 }
        detail:
          type: string
          description: Technical message in English, for developers. Never shown as is.
        instance: { type: string, example: /api/tournaments }
        code: { $ref: '#/components/schemas/ErrorCode' }
        errors:
          type: array
          description: Field errors, with `VALIDATION_FAILED`
          items: { $ref: '#/components/schemas/FieldError' }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Request field path, e.g. `categoryLabel` or `scoring.pointCap`
        message: { type: string }

    ErrorCode:
      type: string
      description: |
        Machine-readable error code, translated by clients. `x-status: planned` codes come
        with planned operations.
      enum:
        # Generic
        - VALIDATION_FAILED
        - DATA_CONFLICT
        - INTERNAL_ERROR
        # Authentication and accounts
        - UNAUTHORIZED
        - FORBIDDEN
        - INVALID_CREDENTIALS
        - TOO_MANY_LOGIN_ATTEMPTS
        - INVALID_ROLE
        - EMAIL_ALREADY_USED
        # Tablets
        - INVALID_PAIRING_CODE
        - TOO_MANY_PAIRING_ATTEMPTS
        - TABLET_REVOKED
        # Not found
        - ORGANIZATION_NOT_FOUND
        - TOURNAMENT_NOT_FOUND
        - EVENT_NOT_FOUND
        - COURT_NOT_FOUND
        - MATCH_NOT_FOUND
        - TABLET_NOT_FOUND
        - CLUB_NOT_FOUND
        - PLAYER_NOT_FOUND
        - REGISTRATION_NOT_FOUND
        - DRAW_NOT_FOUND
        # Tournaments
        - INVALID_DATE_RANGE
        - INVALID_ORGANIZATION
        - INVALID_SCORING_RULES
        - INVALID_RELAY_SETTINGS
        - INVALID_FORBIDDEN_COMBINATION
        - TOURNAMENT_ALREADY_STARTED
        - RULES_LOCKED
        # Events
        - EVENT_NAME_ALREADY_EXISTS
        - INVALID_FORMAT_SETTINGS
        # Courts
        - COURT_LIMIT_REACHED
        - COURT_NOT_LAST
        - COURT_INACTIVE
        - COURT_IN_USE
        # Matches
        - INVALID_MATCH_SIDES
        - INVALID_MATCH_RESULT
        - INVALID_STATUS_TRANSITION
        - MATCH_SIDES_INCOMPLETE
        - STATE_VERSION_CONFLICT
        # Clubs and players (planned)
        - CLUB_NAME_ALREADY_EXISTS
        - INVALID_CLUB
        - LOGO_TOO_LARGE
        - UNSUPPORTED_LOGO_TYPE
        - PLAYER_LICENSE_ALREADY_EXISTS
        # Registrations (planned)
        - PLAYER_NOT_ELIGIBLE
        - PARTNER_NOT_ELIGIBLE
        - ALREADY_REGISTERED
        - PARTNER_ALREADY_REGISTERED
        - EVENT_FULL
        - FORBIDDEN_COMBINATION
        - NOT_PENDING
        - INCOMPATIBLE_EVENT
        - DRAW_PUBLISHED
        # Import (planned)
        - PLAYER_UNRESOLVED
        - CLUB_CITY_REQUIRED
        - PARTNER_UNRESOLVED
        - UNKNOWN_EVENT
        # Draws (planned)
        - NOT_ENOUGH_ENTRIES
        - INVALID_DRAW_SETTINGS
        - INVALID_SWAP
        - INVALID_SERIES_SPLIT
        # Scores (planned)
        - INVALID_SCORE_EVENT
        - SEQUENCE_GAP
        - EVENT_ID_CONFLICT
        - MATCH_NOT_IN_PROGRESS

    # ------------------------------------------------------------ Enums
    Discipline:
      type: string
      description: MS men's singles, WS women's singles, MD men's doubles, WD women's doubles, XD mixed doubles, OD open doubles (any pair)
      enum: [MS, WS, MD, WD, XD, OD]
    CompetitionType:
      type: string
      description: TEAM is phase 2
      enum: [INDIVIDUAL, TEAM]
    DrawFormat:
      type: string
      description: SINGLE_POOL is a round robin (everyone plays everyone)
      enum: [SINGLE_ELIMINATION, POOLS_THEN_ELIMINATION, SINGLE_POOL]
    PlayMode:
      type: string
      description: RELAY (relay scoring with steps) is phase 2
      enum: [SETS, RELAY]
    CategoryType:
      type: string
      description: OPEN to all, AGE (youth or veterans, from the birth year), LEVEL (ranking level)
      enum: [OPEN, AGE, LEVEL]
    Gender:
      type: string
      enum: [MALE, FEMALE]
    RegistrationStatus:
      type: string
      description: |
        CONFIRMED: singles, or a pair confirmed by both players (or entered by the organizer).
        PENDING_PARTNER: the partner has not confirmed yet.
        LOOKING_FOR_PARTNER: doubles without a partner yet.
      enum: [CONFIRMED, PENDING_PARTNER, LOOKING_FOR_PARTNER]

    # ------------------------------------------------------------ Auth and accounts
    UserRole:
      type: string
      enum: [ADMIN, ORGANIZER, CLUB, PLAYER]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 1, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresAt]
      properties:
        accessToken:
          type: string
          description: 'To send as `Authorization: Bearer <accessToken>`'
        tokenType: { type: string, enum: [Bearer] }
        expiresAt: { type: string, format: date-time }

    CurrentUser:
      type: object
      required: [id, email, role, organizationId]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        organizationId:
          type: [string, 'null']
          format: uuid
          description: The federation of an organizer; null for other roles

    Account:
      type: object
      required: [id, email, role, organizationId, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, description: Stored in lower case }
        role: { $ref: '#/components/schemas/UserRole' }
        organizationId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }

    CreateAccountRequest:
      type: object
      required: [email, password, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 12
          maxLength: 72
          description: At most 72 bytes in UTF-8
        role:
          allOf: [{ $ref: '#/components/schemas/UserRole' }]
          description: Only `ORGANIZER` for now
        organizationId:
          type: [string, 'null']
          format: uuid
          description: Required for an organizer

    # ------------------------------------------------------------ Organizations
    Organization:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }

    # ------------------------------------------------------------ Tournaments
    ScoringRules:
      type: object
      required: [gamesToWin, pointsToWin, twoPointLead, pointCap]
      properties:
        gamesToWin: { type: integer, minimum: 1, maximum: 3 }
        pointsToWin:
          type: integer
          minimum: 1
          maximum: 50
          description: Points to win a game (in relay mode, the target score)
        twoPointLead:
          type: boolean
          description: false = the first to reach `pointsToWin` wins
        pointCap:
          type: [integer, 'null']
          minimum: 1
          maximum: 50
          description: Required and ≥ `pointsToWin` when `twoPointLead`, otherwise null

    DisciplinePair:
      type: array
      items: { $ref: '#/components/schemas/Discipline' }
      minItems: 2
      maxItems: 2
      description: Two different disciplines, both offered by the tournament

    Tournament:
      type: object
      required:
        - id
        - organizationId
        - name
        - startsAt
        - endsAt
        - minimumRestMinutes
        - competitionType
        - drawFormat
        - playMode
        - scoring
        - relayStep
        - disciplines
        - forbiddenCombinations
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        minimumRestMinutes: { type: integer, minimum: 0, maximum: 1440 }
        averageMatchMinutes:
          type: integer
          minimum: 10
          maximum: 120
          default: 25
          x-status: planned
          description: Planned. Average length of a match, warm-up included; used by the schedule
        convocationLeadMinutes:
          type: integer
          minimum: 0
          maximum: 120
          default: 30
          x-status: planned
          description: Planned. Players are called this long before their first match
        publicVisibility:
          $ref: '#/components/schemas/PublicVisibility'
        competitionType: { $ref: '#/components/schemas/CompetitionType' }
        drawFormat: { $ref: '#/components/schemas/DrawFormat' }
        playMode: { $ref: '#/components/schemas/PlayMode' }
        scoring: { $ref: '#/components/schemas/ScoringRules' }
        relayStep:
          type: [integer, 'null']
          minimum: 1
          maximum: 50
          description: Only in RELAY mode
        disciplines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Discipline' }
        forbiddenCombinations:
          type: array
          items: { $ref: '#/components/schemas/DisciplinePair' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateTournamentRequest:
      type: object
      required:
        - organizationId
        - name
        - startsAt
        - endsAt
        - minimumRestMinutes
        - courtCount
        - competitionType
        - drawFormat
        - playMode
        - scoring
        - disciplines
      properties:
        organizationId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        startsAt: { type: string, format: date-time }
        endsAt:
          type: string
          format: date-time
          description: After `startsAt` (INVALID_DATE_RANGE)
        minimumRestMinutes: { type: integer, minimum: 0, maximum: 1440 }
        courtCount: { type: integer, minimum: 1, maximum: 50 }
        competitionType: { $ref: '#/components/schemas/CompetitionType' }
        drawFormat: { $ref: '#/components/schemas/DrawFormat' }
        playMode: { $ref: '#/components/schemas/PlayMode' }
        scoring: { $ref: '#/components/schemas/ScoringRules' }
        relayStep: { type: [integer, 'null'], minimum: 1, maximum: 50 }
        disciplines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Discipline' }
        forbiddenCombinations:
          type: array
          default: []
          items: { $ref: '#/components/schemas/DisciplinePair' }

    UpdateTournamentRequest:
      type: object
      description: Every field is optional; only present fields change.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        minimumRestMinutes: { type: integer, minimum: 0, maximum: 1440 }
        averageMatchMinutes:
          type: integer
          minimum: 10
          maximum: 120
          default: 25
          x-status: planned
          description: Planned. Average length of a match, warm-up included; used by the schedule
        convocationLeadMinutes:
          type: integer
          minimum: 0
          maximum: 120
          default: 30
          x-status: planned
          description: Planned. Players are called this long before their first match
        publicVisibility:
          $ref: '#/components/schemas/PublicVisibility'
        competitionType: { $ref: '#/components/schemas/CompetitionType' }
        drawFormat: { $ref: '#/components/schemas/DrawFormat' }
        playMode: { $ref: '#/components/schemas/PlayMode' }
        scoring:
          type: object
          description: Only present fields change
          properties:
            gamesToWin: { type: integer, minimum: 1, maximum: 3 }
            pointsToWin: { type: integer, minimum: 1, maximum: 50 }
            twoPointLead: { type: boolean }
            pointCap: { type: [integer, 'null'], minimum: 1, maximum: 50 }
        relayStep: { type: [integer, 'null'], minimum: 1, maximum: 50 }
        disciplines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Discipline' }
        forbiddenCombinations:
          type: array
          items: { $ref: '#/components/schemas/DisciplinePair' }

    # ------------------------------------------------------------ Events
    Event:
      type: object
      required:
        - id
        - tournamentId
        - name
        - discipline
        - categoryType
        - categoryLabel
        - plannedDate
        - maxEntries
        - minBirthYear
        - maxBirthYear
        - poolCount
        - poolSize
        - qualifiersPerPool
        - parentEventId
      properties:
        id: { type: string, format: uuid }
        tournamentId: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        discipline: { $ref: '#/components/schemas/Discipline' }
        categoryType: { $ref: '#/components/schemas/CategoryType' }
        categoryLabel:
          type: [string, 'null']
          maxLength: 50
          description: Displayed label, e.g. "Cadet U17"; null for OPEN
        plannedDate:
          type: [string, 'null']
          format: date-time
          description: Planned day or slot, shown at registration
        plannedEndDate:
          type: [string, 'null']
          format: date-time
          x-status: planned
          description: Planned. End of the slot of the event; after `plannedDate`
        thirdPlaceMatch:
          type: boolean
          default: false
          x-status: planned
          description: Planned. The two semi-final losers play for third place
        maxEntries:
          type: [integer, 'null']
          minimum: 2
          maximum: 256
          description: Maximum entries (players, pairs or teams); null = unlimited
        minBirthYear:
          type: [integer, 'null']
          description: |
            Planned. Oldest birth year allowed (youth categories: younger players may play up).
            Only for AGE events.
          x-status: planned
        maxBirthYear:
          type: [integer, 'null']
          description: |
            Planned. Most recent birth year allowed (veterans). Only for AGE events.
          x-status: planned
        poolCount: { type: [integer, 'null'], minimum: 1, maximum: 16 }
        poolSize:
          type: [integer, 'null']
          minimum: 3
          maximum: 8
          description: |
            Planned size before registrations. Once the organizer sets `poolCount`, the draw
            derives the actual sizes (13 entries in 3 pools → 5, 4, 4).
        qualifiersPerPool:
          type: [integer, 'null']
          minimum: 1
          maximum: 7
          description: Less than the smallest pool
        parentEventId:
          type: [string, 'null']
          format: uuid
          x-status: planned
          description: |
            Planned. For a level series, the event it was split from (see
            `POST /events/{eventId}/series`); null otherwise.

    CreateEventRequest:
      type: object
      required: [name, discipline, categoryType]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        discipline: { $ref: '#/components/schemas/Discipline' }
        categoryType: { $ref: '#/components/schemas/CategoryType' }
        categoryLabel:
          type: [string, 'null']
          maxLength: 50
          description: Required unless OPEN (VALIDATION_FAILED on `categoryLabel`)
        plannedDate: { type: [string, 'null'], format: date-time }
        plannedEndDate:
          type: [string, 'null']
          format: date-time
          x-status: planned
          description: Planned. End of the slot of the event; after `plannedDate`
        thirdPlaceMatch:
          type: boolean
          default: false
          x-status: planned
          description: Planned. The two semi-final losers play for third place
        maxEntries: { type: [integer, 'null'], minimum: 2, maximum: 256 }
        minBirthYear: { type: [integer, 'null'], x-status: planned }
        maxBirthYear: { type: [integer, 'null'], x-status: planned }
        poolCount: { type: [integer, 'null'], minimum: 1 }
        poolSize: { type: [integer, 'null'], minimum: 3, maximum: 8 }
        qualifiersPerPool: { type: [integer, 'null'], minimum: 1, maximum: 7 }

    UpdateEventRequest:
      type: object
      description: |
        Only present fields change. `plannedDate`, `maxEntries`, `minBirthYear` and
        `maxBirthYear` sent as null are cleared.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        discipline: { $ref: '#/components/schemas/Discipline' }
        categoryType: { $ref: '#/components/schemas/CategoryType' }
        categoryLabel: { type: [string, 'null'], maxLength: 50 }
        plannedDate: { type: [string, 'null'], format: date-time }
        plannedEndDate:
          type: [string, 'null']
          format: date-time
          x-status: planned
          description: Planned. End of the slot of the event; after `plannedDate`
        thirdPlaceMatch:
          type: boolean
          default: false
          x-status: planned
          description: Planned. The two semi-final losers play for third place
        maxEntries: { type: [integer, 'null'], minimum: 2, maximum: 256 }
        minBirthYear: { type: [integer, 'null'], x-status: planned }
        maxBirthYear: { type: [integer, 'null'], x-status: planned }
        poolCount: { type: [integer, 'null'], minimum: 1 }
        poolSize: { type: [integer, 'null'], minimum: 3, maximum: 8 }
        qualifiersPerPool: { type: [integer, 'null'], minimum: 1, maximum: 7 }

    # ------------------------------------------------------------ Courts
    Court:
      type: object
      required: [id, tournamentId, number, active]
      properties:
        id: { type: string, format: uuid }
        tournamentId: { type: string, format: uuid }
        number:
          type: integer
          minimum: 1
          description: Unique in the tournament; displayed as "Court 3" by clients
        active:
          type: boolean
          description: A disabled court receives no new match

    UpdateCourtRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean }

    # ------------------------------------------------------------ Matches
    MatchStatus:
      type: string
      enum: [SCHEDULED, READY, CALLED, WARMUP, IN_PROGRESS, FINISHED, CANCELLED, WALKOVER]
      description: |
        - `SCHEDULED`: to be played; a side may still be unknown.
        - `READY`: both sides are known and available, waiting for a court.
        - `CALLED`: the players are called to the court.
        - `WARMUP`: the players warm up on the court.
        - `IN_PROGRESS`: being played.
        - `FINISHED`: won on the court (`NORMAL`) or by retirement during the match (`RETIRED`).
        - `CANCELLED`: will not be played, without a winner (e.g. event cancelled).
        - `WALKOVER`: won by forfeit before the start: a side did not show up or withdrew.

    MatchSide:
      type: string
      enum: [A, B]
      description: One of the two players or pairs of a match, as listed in the match

    MatchOutcome:
      type: string
      enum: [NORMAL, RETIRED, WALKOVER]
      description: |
        How the match was won: played to the end, retirement of the loser during the match,
        or forfeit before the start.

    Match:
      type: object
      required: [id, tournamentId, eventId, round, sideA, sideB, status, winner, outcome,
        stateVersion, startedAt, endedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        tournamentId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        round:
          type: [integer, 'null']
          minimum: 1
          description: Round in the draw, from 1; null when the match is not part of a draw
        sideA:
          type: [string, 'null']
          format: uuid
          description: Registration (player, or pair in doubles) of side A; null while unknown
        sideB:
          type: [string, 'null']
          format: uuid
          description: Registration of side B; null while unknown
        status: { $ref: '#/components/schemas/MatchStatus' }
        winner:
          oneOf:
            - $ref: '#/components/schemas/MatchSide'
            - type: 'null'
          description: Set with `FINISHED` and `WALKOVER`
        outcome:
          oneOf:
            - $ref: '#/components/schemas/MatchOutcome'
            - type: 'null'
          description: Set with `FINISHED` and `WALKOVER`
        stateVersion:
          type: integer
          minimum: 0
          description: Incremented on every change; send it back to change the status
        startedAt:
          type: [string, 'null']
          format: date-time
          description: When the match went `IN_PROGRESS` for the first time
        endedAt:
          type: [string, 'null']
          format: date-time
          description: When the match became `FINISHED`, `CANCELLED` or `WALKOVER`
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateMatchRequest:
      type: object
      properties:
        round: { type: [integer, 'null'], minimum: 1, maximum: 20 }
        sideA:
          type: [string, 'null']
          format: uuid
          description: Registration id; not checked until registrations are stored by the API
        sideB: { type: [string, 'null'], format: uuid }

    ChangeMatchStatusRequest:
      type: object
      required: [status, stateVersion]
      properties:
        status: { $ref: '#/components/schemas/MatchStatus' }
        stateVersion:
          type: integer
          minimum: 0
          description: The `stateVersion` of the match as read by the client
        winner:
          oneOf:
            - $ref: '#/components/schemas/MatchSide'
            - type: 'null'
          description: Required for `FINISHED` and `WALKOVER`
        outcome:
          type: [string, 'null']
          enum: [NORMAL, RETIRED, null]
          description: Required for `FINISHED`

    # ------------------------------------------------------------ Tablets
    PairingCode:
      type: object
      required: [code, courtId, expiresAt]
      properties:
        code:
          type: string
          pattern: '^[A-HJKMNP-Z2-9]{6}$'
          description: 6 characters, without the ones easy to confuse (0, O, 1, I, L)
          example: K7MP4X
        courtId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }

    PairTabletRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
          description: Case insensitive; spaces and dashes are ignored
        deviceName:
          type: [string, 'null']
          maxLength: 100
          description: Shown to the organizer to recognize the tablet, e.g. "Galaxy Tab A8"

    PairTabletResponse:
      type: object
      required: [tabletId, accessToken, tokenType, court]
      properties:
        tabletId: { type: string, format: uuid }
        accessToken:
          type: string
          description: 'To keep on the tablet and send as `Authorization: Bearer <accessToken>`'
        tokenType: { type: string, enum: [Bearer] }
        court: { $ref: '#/components/schemas/Court' }

    CurrentTablet:
      type: object
      required: [id, deviceName, pairedAt, court]
      properties:
        id: { type: string, format: uuid }
        deviceName: { type: [string, 'null'] }
        pairedAt: { type: string, format: date-time }
        court: { $ref: '#/components/schemas/Court' }

    Tablet:
      type: object
      required: [id, courtId, courtNumber, deviceName, pairedAt, lastSeenAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        courtId: { type: string, format: uuid }
        courtNumber: { type: integer, minimum: 1 }
        deviceName: { type: [string, 'null'] }
        pairedAt: { type: string, format: date-time }
        lastSeenAt:
          type: string
          format: date-time
          description: Last request made with the tablet token
        revokedAt:
          type: [string, 'null']
          format: date-time
          description: null while the tablet is paired

    # ------------------------------------------------------------ Clubs (planned)
    Club:
      type: object
      required: [id, name, city, address, email, phone, logoUrl]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 100 }
        address:
          type: [string, 'null']
          maxLength: 200
          description: Street address or venue (gym), on one or several lines
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 30 }
        logoUrl:
          type: [string, 'null']
          format: uri-reference
          description: Set through `PUT /clubs/{clubId}/logo`, never in the JSON body

    ClubRequest:
      type: object
      required: [name, city]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique, case and accent insensitive (CLUB_NAME_ALREADY_EXISTS)
        city: { type: string, minLength: 1, maxLength: 100 }
        address: { type: [string, 'null'], maxLength: 200 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 30 }

    UpdateClubRequest:
      type: object
      description: Only present fields change; nullable fields sent as null are cleared.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        city: { type: string, minLength: 1, maxLength: 100 }
        address: { type: [string, 'null'], maxLength: 200 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 30 }

    # ------------------------------------------------------------ Players (planned)
    Player:
      type: object
      required:
        - id
        - firstName
        - lastName
        - gender
        - birthDate
        - club
        - licenseNumber
        - email
        - phone
        - rankings
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        gender: { $ref: '#/components/schemas/Gender' }
        birthDate: { type: string, format: date }
        club: { $ref: '#/components/schemas/ClubSummary' }
        licenseNumber:
          type: [string, 'null']
          maxLength: 30
          description: Unique when set; optional in the MVP (the registration form does not ask for it)
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 30 }
        rankings: { $ref: '#/components/schemas/PlayerRankings' }

    PlayerRankings:
      type: object
      description: >
        French Polynesia ranking, one per discipline family. Optional for now:
        a player without a ranking has null points and position.
        The age category is not stored: it is computed from the birth date
        (see docs/competition-rules.md).
      required: [singles, doubles, mixed]
      properties:
        singles: { $ref: '#/components/schemas/Ranking' }
        doubles: { $ref: '#/components/schemas/Ranking' }
        mixed: { $ref: '#/components/schemas/Ranking' }

    Ranking:
      type: object
      required: [points, position]
      properties:
        points: { type: [integer, 'null'], minimum: 0 }
        position: { type: [integer, 'null'], minimum: 1 }

    PlayerSummary:
      type: object
      description: Short form used inside registrations and import reports
      required: [id, firstName, lastName, gender, birthDate, clubName, licenseNumber, rankings]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        gender: { $ref: '#/components/schemas/Gender' }
        birthDate: { type: string, format: date }
        clubName: { type: string }
        licenseNumber: { type: [string, 'null'] }
        rankings:
          $ref: '#/components/schemas/PlayerRankings'
          description: Used to sort registrations (points in the discipline, pairs = sum)

    ClubSummary:
      type: object
      required: [id, name, logoUrl]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        logoUrl: { type: [string, 'null'], format: uri-reference }

    PlayerPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Player' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }

    CreatePlayerRequest:
      type: object
      required: [firstName, lastName, gender, birthDate, clubId]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        gender: { $ref: '#/components/schemas/Gender' }
        birthDate: { type: string, format: date }
        clubId:
          type: string
          format: uuid
          description: Unknown club → INVALID_CLUB
        licenseNumber: { type: [string, 'null'], maxLength: 30 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 30 }
        rankings:
          $ref: '#/components/schemas/PlayerRankings'
          description: Replaces the three rankings; missing on creation = no ranking

    UpdatePlayerRequest:
      type: object
      description: Only present fields change; nullable fields sent as null are cleared.
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        gender: { $ref: '#/components/schemas/Gender' }
        birthDate: { type: string, format: date }
        clubId: { type: string, format: uuid }
        licenseNumber: { type: [string, 'null'], maxLength: 30 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 30 }
        rankings:
          $ref: '#/components/schemas/PlayerRankings'
          description: Replaces the three rankings; missing on creation = no ranking

    # ------------------------------------------------------------ Registrations (planned)
    Registration:
      type: object
      required: [id, tournamentId, eventId, status, player, partner, registeredAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        tournamentId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RegistrationStatus' }
        player: { $ref: '#/components/schemas/PlayerSummary' }
        partner:
          oneOf:
            - $ref: '#/components/schemas/PlayerSummary'
            - type: 'null'
          description: Null for singles and for LOOKING_FOR_PARTNER
        registeredAt:
          type: string
          format: date-time
          description: |
            When the player registered: the form timestamp for an import, otherwise the
            creation time. Breaks ties between equal rankings and orders a future waiting list.
            Kept when the registration is moved to another event.
        createdAt: { type: string, format: date-time }

    TransferRequest:
      type: object
      required: [registrationIds]
      properties:
        registrationIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }

    TransferResult:
      type: object
      required: [moved, rejected]
      properties:
        moved:
          type: array
          items: { $ref: '#/components/schemas/Registration' }
        rejected:
          type: array
          items:
            type: object
            required: [registrationId, code, message]
            properties:
              registrationId: { type: string, format: uuid }
              code:
                type: string
                description: |
                  INCOMPATIBLE_EVENT, PLAYER_NOT_ELIGIBLE, PARTNER_NOT_ELIGIBLE,
                  ALREADY_REGISTERED, PARTNER_ALREADY_REGISTERED, EVENT_FULL,
                  REGISTRATION_NOT_FOUND
              message: { type: string }

    CreateRegistrationRequest:
      type: object
      required: [playerId]
      properties:
        playerId: { type: string, format: uuid }
        partnerId:
          type: [string, 'null']
          format: uuid
          description: Doubles only; absent or null = looking for a partner

    UpdateRegistrationRequest:
      type: object
      properties:
        partnerId: { type: [string, 'null'], format: uuid }
        confirm:
          type: boolean
          description: true confirms a PENDING_PARTNER pair (otherwise NOT_PENDING)

    # ------------------------------------------------------------ Import (planned)
    ImportRequest:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: '#/components/schemas/ImportRow' }

    ImportRow:
      type: object
      description: One line of the registration form, normalized by the web app
      required: [rowNumber, firstName, lastName, birthDate, gender, clubName, entries]
      properties:
        rowNumber:
          type: integer
          minimum: 1
          description: Line number in the file, to report errors
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        birthDate: { type: string, format: date }
        gender: { $ref: '#/components/schemas/Gender' }
        clubName:
          type: string
          minLength: 1
          description: Matched to an existing club (case and accent insensitive), otherwise created
        clubCity:
          type: [string, 'null']
          description: >
            Required when the club does not exist yet (the city of a club is required),
            otherwise ignored. Missing for a new club → row issue CLUB_CITY_REQUIRED.
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'], maxLength: 30 }
        registeredAt:
          type: [string, 'null']
          format: date-time
          description: Form timestamp (UTC); null = import time
        playerDecision: { $ref: '#/components/schemas/PlayerDecision' }
        entries:
          type: array
          description: One per event the player registers in
          items: { $ref: '#/components/schemas/ImportEntry' }

    ImportEntry:
      type: object
      required: [eventId, partner]
      properties:
        eventId: { type: string, format: uuid }
        partner: { $ref: '#/components/schemas/ImportPartner' }
        partnerDecision: { $ref: '#/components/schemas/PlayerDecision' }

    ImportPartner:
      type: object
      description: What the form said about the partner
      required: [kind]
      properties:
        kind:
          type: string
          enum: [NONE, LOOKING, NAMED]
          description: NONE = singles; LOOKING = "looking for a partner"; NAMED = a name was given
        name:
          type: string
          description: Full name as typed in the form, when NAMED

    PlayerDecision:
      type: object
      description: |
        The organizer's choice after a preview, for a row whose match was not EXACT.
        Absent = let the backend decide (EXACT match, or a new profile when NONE).
      required: [action]
      properties:
        action:
          type: string
          enum: [USE_EXISTING, CREATE_NEW]
        playerId:
          type: string
          format: uuid
          description: Required with USE_EXISTING

    PlayerMatch:
      type: object
      required: [result, selectedPlayerId, candidates]
      properties:
        result:
          type: string
          description: |
            EXACT: same name and birth date, associated automatically (shown for checking).
            PROBABLE: close name and same birth date, to confirm.
            AMBIGUOUS: several possible profiles, or same name with another birth date: the
            organizer chooses.
            NONE: no close profile, a new profile will be created.
          enum: [EXACT, PROBABLE, AMBIGUOUS, NONE]
        selectedPlayerId:
          type: [string, 'null']
          format: uuid
          description: Profile used if the import is confirmed as is (null = new profile, or undecided)
        candidates:
          type: array
          description: Best candidates first (at most 5)
          items: { $ref: '#/components/schemas/PlayerCandidate' }

    PlayerCandidate:
      type: object
      required: [player, score, reasons]
      properties:
        player: { $ref: '#/components/schemas/PlayerSummary' }
        score:
          type: number
          minimum: 0
          maximum: 1
        reasons:
          type: array
          items:
            type: string
            enum: [SAME_NAME, SIMILAR_NAME, SAME_BIRTH_DATE, DIFFERENT_BIRTH_DATE, SAME_CLUB, OTHER_ROW_OF_FILE]

    ImportIssue:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }

    ImportRowReport:
      type: object
      required: [rowNumber, imported, playerMatch, entries, issues]
      properties:
        rowNumber: { type: integer }
        imported:
          type: boolean
          description: Always false with dryRun
        playerMatch: { $ref: '#/components/schemas/PlayerMatch' }
        entries:
          type: array
          items:
            type: object
            required: [eventId, status, partnerMatch, issues]
            properties:
              eventId: { type: string, format: uuid }
              status:
                oneOf:
                  - $ref: '#/components/schemas/RegistrationStatus'
                  - type: 'null'
                description: Status the registration gets (null when it cannot be imported)
              partnerMatch:
                oneOf:
                  - $ref: '#/components/schemas/PlayerMatch'
                  - type: 'null'
                description: Null when there is no named partner
              issues:
                type: array
                description: |
                  E.g. PLAYER_NOT_ELIGIBLE, EVENT_FULL, FORBIDDEN_COMBINATION (blocking: status null);
                  ALREADY_REGISTERED (the entry is skipped); PARTNER_UNRESOLVED (not blocking: the
                  entry is imported as LOOKING_FOR_PARTNER, the organizer adds the partner later)
                items: { $ref: '#/components/schemas/ImportIssue' }
        issues:
          type: array
          description: >
            Row-level issues, blocking the whole row: PLAYER_UNRESOLVED (AMBIGUOUS match without
            decision), CLUB_CITY_REQUIRED (new club without city)
          items: { $ref: '#/components/schemas/ImportIssue' }

    ImportReport:
      type: object
      required: [dryRun, summary, rows]
      properties:
        dryRun: { type: boolean }
        summary:
          type: object
          required:
            - rows
            - rowsWithIssues
            - playersMatched
            - playersToCreate
            - playersToConfirm
            - confirmed
            - pendingPartner
            - lookingForPartner
          properties:
            rows: { type: integer }
            rowsWithIssues: { type: integer }
            playersMatched: { type: integer, description: EXACT matches }
            playersToCreate: { type: integer, description: NONE matches }
            playersToConfirm: { type: integer, description: PROBABLE and AMBIGUOUS matches without decision }
            confirmed: { type: integer }
            pendingPartner: { type: integer }
            lookingForPartner: { type: integer }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ImportRowReport' }

    # ------------------------------------------------------------ Draws (planned)
    DrawStatus:
      type: string
      enum: [DRAFT, PUBLISHED]

    DrawEntry:
      type: object
      required: [registrationId, seed, points, player, partner]
      properties:
        registrationId: { type: string, format: uuid }
        seed: { type: [integer, 'null'], minimum: 1, description: Seed number; null if not seeded }
        points:
          type: [number, 'null']
          description: Ranking points in the discipline (sum for a pair); null if unranked
        player: { $ref: '#/components/schemas/PlayerSummary' }
        partner:
          oneOf:
            - $ref: '#/components/schemas/PlayerSummary'
            - type: 'null'

    Pool:
      type: object
      required: [name, qualifiers, entries]
      properties:
        name: { type: string, example: A }
        qualifiers: { type: integer, minimum: 0, description: 0 for a single pool }
        entries:
          type: array
          items: { $ref: '#/components/schemas/DrawEntry' }

    PoolQualifier:
      type: object
      required: [pool, rank]
      properties:
        pool: { type: string, example: A }
        rank: { type: integer, minimum: 1 }

    BracketSlot:
      type: object
      required: [position, entry, qualifier, bye]
      description: |
        One line of the first round. Exactly one of: `entry` (single elimination), `qualifier`
        (pools then knockout, filled when the pools end) or `bye`.
      properties:
        position: { type: integer, minimum: 1 }
        entry:
          oneOf:
            - $ref: '#/components/schemas/DrawEntry'
            - type: 'null'
        qualifier:
          oneOf:
            - $ref: '#/components/schemas/PoolQualifier'
            - type: 'null'
        bye: { type: boolean }

    Bracket:
      type: object
      required: [size, slots]
      properties:
        size: { type: integer, description: Power of 2 }
        slots:
          type: array
          items: { $ref: '#/components/schemas/BracketSlot' }

    Draw:
      type: object
      required:
        - eventId
        - status
        - seedCount
        - pools
        - bracket
        - excludedRegistrationIds
        - createdAt
        - publishedAt
      properties:
        eventId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DrawStatus' }
        seedCount: { type: integer, minimum: 0 }
        pools:
          type: array
          description: Empty for single elimination
          items: { $ref: '#/components/schemas/Pool' }
        bracket:
          oneOf:
            - $ref: '#/components/schemas/Bracket'
            - type: 'null'
          description: Null for a single pool
        excludedRegistrationIds:
          type: array
          description: Registrations not drawn (not `CONFIRMED`)
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }

    DrawSettings:
      type: object
      description: All optional; missing or null = event value, then default
      properties:
        poolCount: { type: [integer, 'null'], minimum: 1, maximum: 16 }
        qualifiersPerPool: { type: [integer, 'null'], minimum: 1, maximum: 7 }
        seedCount: { type: [integer, 'null'], minimum: 0 }

    DrawSlotRef:
      oneOf:
        - type: object
          required: [pool, index]
          properties:
            pool: { type: string }
            index: { type: integer, minimum: 0 }
        - type: object
          required: [position]
          properties:
            position: { type: integer, minimum: 1 }

    DrawSwapRequest:
      type: object
      required: [a, b]
      properties:
        a: { $ref: '#/components/schemas/DrawSlotRef' }
        b: { $ref: '#/components/schemas/DrawSlotRef' }

    SeriesSplitRequest:
      type: object
      required: [series]
      properties:
        series:
          type: array
          minItems: 2
          maxItems: 8
          description: From the strongest series to the weakest
          items:
            type: object
            required: [label, registrationIds]
            properties:
              label: { type: string, maxLength: 50, example: Série 1 }
              registrationIds:
                type: array
                minItems: 2
                items: { type: string, format: uuid }

    SeriesSplitResult:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
    # ------------------------------------------------------------ Scores
    ScoreEventType:
      type: string
      enum: [POINT, UNDO]
      description: |
        - `POINT`: a rally won by `side`.
        - `UNDO`: cancels the last `POINT` that is not cancelled yet. It is also accepted
          after the last point of a finished match: the match is then in progress again.

        Game and match ends are computed by the server from the points and the scoring
        rules of the tournament. Other events (cards, retirement) will be added with the
        match lifecycle (#143).

    ScoreEvent:
      type: object
      required: [id, sequence, type, occurredAt]
      properties:
        id:
          type: string
          format: uuid
          description: Generated by the tablet; the same event always keeps the same id
        sequence:
          type: integer
          minimum: 1
          description: Position of the event in the match, from 1, without gaps
        type: { $ref: '#/components/schemas/ScoreEventType' }
        side:
          allOf: [{ $ref: '#/components/schemas/MatchSide' }]
          description: Required for `POINT`, absent for `UNDO`
        occurredAt:
          type: string
          format: date-time
          description: When the umpire entered the event, from the tablet clock

    ScoreEventBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ScoreEvent' }

    GameScore:
      type: object
      required: [a, b]
      properties:
        a: { type: integer, minimum: 0 }
        b: { type: integer, minimum: 0 }

    MatchScore:
      type: object
      required: [games, winner]
      properties:
        games:
          type: array
          description: Score of each game played or in progress, in order
          items: { $ref: '#/components/schemas/GameScore' }
        winner:
          type: [string, 'null']
          enum: [A, B, null]
          description: Set once the match is won

    ScoreEventAck:
      type: object
      required: [acceptedIds, duplicateIds, lastSequence, score]
      properties:
        acceptedIds:
          type: array
          description: Events applied by this request
          items: { type: string, format: uuid }
        duplicateIds:
          type: array
          description: Events already received before, not applied again
          items: { type: string, format: uuid }
        lastSequence:
          type: integer
          minimum: 0
          description: Highest sequence applied for the match; the next event is lastSequence + 1
        score: { $ref: '#/components/schemas/MatchScore' }

    ScoreEventProblem:
      description: Problem Details of a rejected batch
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            expectedSequence:
              type: integer
              minimum: 1
              description: With `SEQUENCE_GAP`, the sequence the tablet must send again from

    PublicVisibility:
      type: string
      enum: [ON_PUBLISH, AT_START]
      default: ON_PUBLISH
      x-status: planned
      description: |
        Planned. When the public pages show draws and schedule: `ON_PUBLISH` as soon as the
        organizer publishes them, `AT_START` only from the first day of the tournament (players
        still get their call time).
