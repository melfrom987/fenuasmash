        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Players (planned)
  /players:
    get:
      tags: [Players]
      operationId: listPlayers
      x-roles: [ORGANIZER, CLUB]
      x-status: planned
      summary: Search players, paginated, by last name then first name
      parameters:
        - name: q
          in: query
          description: Matches last name, first name or license number (case and accent insensitive)
          schema: { type: string }
        - name: clubId
          in: query
          schema: { type: string, format: uuid }
        - name: gender
          in: query
          schema: { $ref: '#/components/schemas/Gender' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of players
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Players]
      operationId: createPlayer
      x-roles: [ORGANIZER]
      x-status: planned
      summary: Create a player
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlayerRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # VALIDATION_FAILED, INVALID_CLUB
        '409':
          $ref: '#/components/responses/Conflict'
          # PLAYER_LICENSE_ALREADY_EXISTS
        '401': { $ref: '#/components/responses/Unauthorized' }
