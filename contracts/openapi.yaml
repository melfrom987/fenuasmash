openapi: 3.1.0

info:
  title: FenuaSmash API
  version: 0.1.0
  description: |
    Badminton tournament management: tournaments and their rules, events, courts,
    matches, umpire tablets, clubs, players and registrations.

    This file is the single source of truth shared by the backend, the web app and the
    mobile app (see `contracts/README.md`). It is updated **before** the code.

    Conventions:
    - All dates and times are UTC, ISO 8601 (`2026-11-21T18:00:00Z`). Clients display them
      in Tahiti time (`Pacific/Tahiti`, UTC−10). Birth dates are plain dates (`2010-11-21`).
    - Identifiers are UUIDs.
    - `PATCH` updates only the fields present in the body. For nullable fields, a field sent
      as `null` is cleared, an absent field is kept.
    - Errors use the Problem Details format with a machine-readable `code`
      (see `ProblemDetail`). Clients translate the `code`, not the `detail`.

    Operations marked with `x-status: planned` are not implemented yet: they describe what
    the backend will implement next, so that web and mobile can work in parallel (with mocks).

    Authentication:
    - Log in with `POST /auth/login`, then send `Authorization: Bearer <accessToken>` on every
      request. The token is valid for 12 hours (`expiresAt`); after that, log in again.
    - Operations with `security: []` are public. The others need a token, and `x-roles` lists
      the roles allowed to call them.
    - No token, or an invalid or expired one, returns **401** `UNAUTHORIZED`, even on a public
      operation: the client should then log in again. A role that is not allowed returns
      **403** `FORBIDDEN`.
    - Umpire tablets do not log in: they are paired with a court with a one-time code
      (`POST /tablets/pair`) and send the tablet token they get the same way, as
      `Authorization: Bearer <accessToken>`. A tablet token has no expiry, but stops working
      as soon as the tablet is revoked: requests then return **401** `TABLET_REVOKED`.

    | Role | Can |
    |---|---|
    | (public) | Read organizations, tournaments, events, courts, matches and clubs |
    | `ADMIN` | Create accounts and organizations |
    | `ORGANIZER` | Manage tournaments, events, courts, matches, clubs, players and registrations |
    | `CLUB` | Read players and registrations (planned: only the players of its club) |
    | `PLAYER` | Planned with online registration (phase 3) |
    | `TABLET` | A paired umpire tablet: reads its court and moves the match on it (planned: sends its scores) |

servers:
  - url: /api

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Accounts
  - name: Organizations
  - name: Tournaments
  - name: Events
  - name: Courts
  - name: Matches
  - name: Tablets
  - name: Clubs
  - name: Players
  - name: Registrations
  - name: Import
  - name: Scores

paths:
  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Log in with an email and a password
      description: |
        The email is case insensitive. A wrong password and an unknown email get the same
        `INVALID_CREDENTIALS` answer, so that it never reveals whether an account exists.

        After 5 failed logins for one email, or 20 from one IP address, every login for that
        email or address is refused for 15 minutes with `TOO_MANY_LOGIN_ATTEMPTS`, even with
        the right password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 'Logged in. The response is never cached (`Cache-Control: no-store`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          $ref: '#/components/responses/Unauthorized'
          # INVALID_CREDENTIALS
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the logged-in account
      description: Any logged-in account. Read from the database, so it is always up to date.
      responses:
        '200':
          description: The logged-in account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Accounts
  /accounts:
    post:
      tags: [Accounts]
      operationId: createAccount
      x-roles: [ADMIN]
      summary: Create an account
      description: |
        Only `ORGANIZER` accounts can be created for now (`INVALID_ROLE` otherwise): club
        accounts come with clubs, as each one is linked to its club, and player accounts with
        online registration. The first admin is created when the API starts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # VALIDATION_FAILED, INVALID_ROLE, INVALID_ORGANIZATION
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/Conflict'
          # EMAIL_ALREADY_USED

  # ---------------------------------------------------------------- Organizations
  /organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      security: []
      summary: List organizations
      responses:
        '200':
          description: All organizations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Organization' }
    post:
      tags: [Organizations]
      operationId: createOrganization
      x-roles: [ADMIN]
      summary: Create an organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganizationRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      operationId: getOrganization
      security: []
      summary: Get an organization
      responses:
        '200':
          description: The organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Tournaments
  /tournaments:
    get:
      tags: [Tournaments]
      operationId: listTournaments
      security: []
      summary: List tournaments, most recent start first
      responses:
        '200':
          description: All tournaments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tournament' }
    post:
      tags: [Tournaments]
      operationId: createTournament
      x-roles: [ORGANIZER]
      summary: Create a tournament with its rules and its courts
      description: Courts numbered 1 to `courtCount` are created in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTournamentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tournament' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # VALIDATION_FAILED, INVALID_DATE_RANGE, INVALID_ORGANIZATION, INVALID_SCORING_RULES,
          # INVALID_RELAY_SETTINGS, INVALID_FORBIDDEN_COMBINATION
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tournaments/{tournamentId}:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    get:
      tags: [Tournaments]
      operationId: getTournament
      security: []
      summary: Get a tournament
      responses:
        '200':
          description: The tournament
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tournament' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tournaments]
      operationId: updateTournament
      x-roles: [ORGANIZER]
      summary: Update a tournament and its rules
      description: |
        Only the fields present are changed. Removing a discipline that a forbidden
        combination uses is rejected with `INVALID_FORBIDDEN_COMBINATION`.
        Planned: `RULES_LOCKED` (409) once an event has started.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTournamentRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tournament' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Tournaments]
      operationId: deleteTournament
      x-roles: [ORGANIZER]
      summary: Delete a tournament that has not started
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          # TOURNAMENT_ALREADY_STARTED
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Events
  /tournaments/{tournamentId}/events:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    get:
      tags: [Events]
      operationId: listEvents
      security: []
      summary: List the events of a tournament
      description: Sorted by discipline (MS, WS, MD, WD, XD, OD), then by name.
      responses:
        '200':
          description: The events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Events]
      operationId: createEvent
      x-roles: [ORGANIZER]
      summary: Create an event
      description: |
        Events are created before registrations open. Pool settings can stay empty until
        the draw; if one is set, all three are required. They are rejected when the
        tournament format has no pools.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # VALIDATION_FAILED (categoryLabel required unless OPEN), INVALID_FORMAT_SETTINGS
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          # EVENT_NAME_ALREADY_EXISTS
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      operationId: getEvent
      security: []
      summary: Get an event
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Events]
      operationId: updateEvent
      x-roles: [ORGANIZER]
      summary: Update an event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEventRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Events]
      operationId: deleteEvent
      x-roles: [ORGANIZER]
      summary: Delete an event
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Courts
  /tournaments/{tournamentId}/courts:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    get:
      tags: [Courts]
      operationId: listCourts
      security: []
      summary: List the courts of a tournament, by number
      responses:
        '200':
          description: The courts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Court' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Courts]
      operationId: addCourt
      x-roles: [ORGANIZER]
      summary: Add a court with the next number
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Court' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          # COURT_LIMIT_REACHED (50 courts)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /courts/{courtId}:
    parameters:
      - $ref: '#/components/parameters/CourtId'
    get:
      tags: [Courts]
      operationId: getCourt
      security: []
      summary: Get a court
      responses:
        '200':
          description: The court
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Court' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Courts]
      operationId: updateCourt
      x-roles: [ORGANIZER]
      summary: Enable or disable a court
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCourtRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Court' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Courts]
      operationId: deleteCourt
      x-roles: [ORGANIZER]
      summary: Remove the last court of a tournament
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          # COURT_NOT_LAST, COURT_IN_USE (a match was assigned to it: disable it instead)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Matches
  /events/{eventId}/matches:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Matches]
      operationId: listEventMatches
      security: []
      summary: List the matches of an event
      description: By round (matches without a round last), then creation order.
      responses:
        '200':
          description: The matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Match' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Matches]
      operationId: createMatch
      x-roles: [ORGANIZER]
      summary: Create a match in an event
      description: |
        Matches will mostly be created by the draws (#92, #93). This operation creates one by
        hand, for example for a demonstration or a match added on the day. A side can stay
        empty until it is known, e.g. the winner of a previous round.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMatchRequest' }
      responses:
        '201':
          description: Created, with status `SCHEDULED`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # VALIDATION_FAILED, INVALID_MATCH_SIDES (same registration on both sides)
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tournaments/{tournamentId}/matches:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    get:
      tags: [Matches]
      operationId: listTournamentMatches
      security: []
      summary: List the matches of a tournament, all events together
      description: By round (matches without a round last), then creation order.
      parameters:
        - name: status
          in: query
          description: Only the matches in these statuses; repeat it for several (`?status=READY&status=CALLED`)
          schema:
            type: array
            items: { $ref: '#/components/schemas/MatchStatus' }
          style: form
          explode: true
      responses:
        '200':
          description: The matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Match' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tournaments/{tournamentId}/match-queue:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    get:
      tags: [Matches]
      operationId: getMatchQueue
      security: []
      summary: List the matches waiting for a court
      description: |
        The `READY` matches, in the order they should be called: by round (matches without a
        round last), then creation order. A match is `available` when none of its sides is
        on a court: it can be assigned now.
      responses:
        '200':
          description: The queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QueuedMatch' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tournaments/{tournamentId}/court-assignments:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    get:
      tags: [Matches]
      operationId: listCourtAssignments
      security: []
      summary: List the courts of a tournament with the match on each
      description: |
        Every court, by number, with the match on it (`CALLED`, `WARMUP` or `IN_PROGRESS`), or
        `null` when the court is free. A free court that is `active` can receive a match.
      responses:
        '200':
          description: The courts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CourtAssignment' }
        '404': { $ref: '#/components/responses/NotFound' }

  /matches/{matchId}:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    get:
      tags: [Matches]
      operationId: getMatch
      security: []
      summary: Get a match
      responses:
        '200':
          description: The match
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '404': { $ref: '#/components/responses/NotFound' }

  /matches/{matchId}/court:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    post:
      tags: [Matches]
      operationId: assignMatchToCourt
      x-roles: [ORGANIZER]
      summary: Call a match to a court
      description: |
        Puts a `READY` match on a court: the match becomes `CALLED`. A `CALLED` match can be
        moved to another court the same way. Sending the match back to `READY`
        (`POST /matches/{matchId}/status`) frees the court.

        - The court must belong to the tournament of the match (`INVALID_COURT`) and be
          active (`COURT_INACTIVE`).
        - **One match per court:** a court with a `CALLED`, `WARMUP` or `IN_PROGRESS` match
          gets `COURT_OCCUPIED`.
        - **A side is never on two courts:** when a side of the match is already on another
          court, the answer is `SIDE_ON_ANOTHER_COURT`. Sides are registrations: until
          registrations are stored by the API, a player entered in two events (e.g. singles
          and doubles) is not detected.
        - `stateVersion` works as for status changes (`STATE_VERSION_CONFLICT`).

        Assignments of one tournament are made one at a time: two organizers calling matches
        at the same moment cannot put two matches on one court.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignMatchToCourtRequest' }
      responses:
        '200':
          description: Called to the court
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # VALIDATION_FAILED, INVALID_COURT
        '404':
          $ref: '#/components/responses/NotFound'
          # MATCH_NOT_FOUND, COURT_NOT_FOUND
        '409':
          $ref: '#/components/responses/Conflict'
          # INVALID_STATUS_TRANSITION (not READY or CALLED), COURT_INACTIVE, COURT_OCCUPIED,
          # SIDE_ON_ANOTHER_COURT, STATE_VERSION_CONFLICT
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /matches/{matchId}/status:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    post:
      tags: [Matches]
      operationId: changeMatchStatus
      x-roles: [ORGANIZER, TABLET]
      summary: Move a match to another status
      description: |
        Only these transitions are allowed:

        | From | To |
        |---|---|
        | `SCHEDULED` | `READY`, `CANCELLED`, `WALKOVER` |
        | `READY` | `SCHEDULED`, `CALLED`, `CANCELLED`, `WALKOVER` |
        | `CALLED` | `READY`, `WARMUP`, `CANCELLED`, `WALKOVER` |
        | `WARMUP` | `CALLED`, `IN_PROGRESS`, `CANCELLED`, `WALKOVER` |
        | `IN_PROGRESS` | `FINISHED` |
        | `FINISHED` | `IN_PROGRESS` (reopened, e.g. to undo the last point) |
        | `CANCELLED`, `WALKOVER` | none: final |

        Any other transition gets `INVALID_STATUS_TRANSITION`. Every status except
        `SCHEDULED` and `CANCELLED` needs both sides (`MATCH_SIDES_INCOMPLETE`).

        **Courts:** a match goes `CALLED` with `POST /matches/{matchId}/court`, not here
        (`COURT_REQUIRED`). Back to `READY`, it leaves its court. A finished, cancelled or
        walkover match keeps `courtId`, but frees the court. Reopening a finished match puts
        it back on its court, which must be free (`COURT_OCCUPIED`, `SIDE_ON_ANOTHER_COURT`).

        **Result:** `FINISHED` needs `winner` and `outcome` (`NORMAL`, or `RETIRED` when the
        loser retired). `WALKOVER` needs `winner` (the side that did not forfeit); its
        outcome is `WALKOVER`. Other statuses take neither (`INVALID_MATCH_RESULT`). Leaving
        `FINISHED` clears the result.

        **Concurrent changes:** send the `stateVersion` read with the match. If the match
        changed since, nothing is applied and the answer is `STATE_VERSION_CONFLICT`: read
        the match again, then decide. Every change increments `stateVersion`.

        **Umpire tablet:** a tablet only moves a match on its own court
        (`MATCH_NOT_ON_TABLET_COURT`), and only to `WARMUP`, `IN_PROGRESS`, `FINISHED`, or
        back to `CALLED` from `WARMUP` (`STATUS_NOT_ALLOWED_FOR_TABLET`). Sending a match back
        to the queue, cancelling it and walkovers stay with the organizer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeMatchStatusRequest' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # VALIDATION_FAILED, INVALID_MATCH_RESULT
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          # INVALID_STATUS_TRANSITION, MATCH_SIDES_INCOMPLETE, STATE_VERSION_CONFLICT,
          # COURT_REQUIRED, COURT_OCCUPIED, SIDE_ON_ANOTHER_COURT
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
          # FORBIDDEN, MATCH_NOT_ON_TABLET_COURT, STATUS_NOT_ALLOWED_FOR_TABLET

  # ---------------------------------------------------------------- Tablets
  /courts/{courtId}/pairing-code:
    parameters:
      - $ref: '#/components/parameters/CourtId'
    post:
      tags: [Tablets]
      operationId: createPairingCode
      x-roles: [ORGANIZER]
      summary: Create a one-time code to pair an umpire tablet with a court
      description: |
        The organizer shows the code to the umpire, who types it on the tablet. The code is
        valid for 10 minutes and for one pairing only. Creating a new code for the court
        replaces the previous one. The code is stored hashed: it cannot be read again.
      responses:
        '201':
          description: 'Created. The response is never cached (`Cache-Control: no-store`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingCode' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          # COURT_INACTIVE
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tablets/pair:
    post:
      tags: [Tablets]
      operationId: pairTablet
      security: []
      summary: Pair the tablet with a court, using the code given by the organizer
      description: |
        Returns the tablet token, to send as `Authorization: Bearer <accessToken>` on every
        request. The tablet keeps it until it is revoked; the server only stores its hash.

        A court has one paired tablet at most: pairing a new tablet revokes the previous one.

        The code is case insensitive, and spaces and dashes are ignored. A wrong, expired or
        used code gets `INVALID_PAIRING_CODE`. After 10 wrong codes from one IP address, every
        pairing from that address is refused for 15 minutes with `TOO_MANY_PAIRING_ATTEMPTS`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairTabletRequest' }
      responses:
        '200':
          description: 'Paired. The response is never cached (`Cache-Control: no-store`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairTabletResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
          # VALIDATION_FAILED, INVALID_PAIRING_CODE
        '409':
          $ref: '#/components/responses/Conflict'
          # COURT_INACTIVE
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /tablets/me:
    get:
      tags: [Tablets]
      operationId: getCurrentTablet
      x-roles: [TABLET]
      summary: Get the tablet and its court
      description: |
        Lets the tablet check at startup that it is still paired: a revoked tablet gets
        **401** `TABLET_REVOKED`, and should then ask for a new code.
      responses:
        '200':
          description: The tablet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentTablet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tablets/me/match:
    get:
      tags: [Tablets]
      operationId: getCurrentTabletMatch
      x-roles: [TABLET]
      summary: Get the match on the court of the tablet
      description: The match `CALLED`, `WARMUP` or `IN_PROGRESS` on the court; none when the court is free.
      responses:
        '200':
          description: The match on the court
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '204':
          description: The court is free
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tournaments/{tournamentId}/tablets:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    get:
      tags: [Tablets]
      operationId: listTablets
      x-roles: [ORGANIZER]
      summary: List the tablets paired with the courts of a tournament
      description: By court number, then the most recent pairing first. Revoked tablets are included.
      responses:
        '200':
          description: The tablets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tablet' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tablets/{tabletId}/revoke:
    parameters:
      - $ref: '#/components/parameters/TabletId'
    post:
      tags: [Tablets]
      operationId: revokeTablet
      x-roles: [ORGANIZER]
      summary: Revoke a tablet
      description: |
        The tablet token stops working at once. Revoking a tablet already revoked changes
        nothing and keeps the first `revokedAt`.
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tablet' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

