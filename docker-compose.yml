name: fenuasmash

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fenuasmash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-fenuasmash}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: [stack]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: fenuasmash-api:local
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-fenuasmash}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fenuasmash}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${API_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: [stack]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: fenuasmash-web:local
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8080
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
